<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--/* SCR-U-08x 예약내역 (G-H07~H08 / E-H07~H08)
  state: (없음) 예약내역 H07 | filter 필터 바텀시트 H08
  필터(전체·이사 완료·취소)는 more.js 에서 동작 (해당 항목이 없는 연도는 숨김)
  model reservations (HistoryView.Reservations, MoreController). 없으면(미리보기 /dev) SAMPLE_RESERVATIONS
*/-->
<head th:replace="~{fragments/user-layout :: head(title='예약내역', links=~{::link})}">
  <link rel="stylesheet" th:href="@{/css/user/more.css}">
</head>
<body>
<div class="app-shell" th:with="state=${param.state != null ? param.state[0] : ''}, h=${reservations ?: T(com.codemove.reservation.HistoryView).SAMPLE_RESERVATIONS}">
  <div class="screen form-page">
    <div class="form-head">
      <a th:replace="~{fragments/user-layout :: back(href=@{/more})}"></a>
      <div class="form-title">예약내역</div>
    </div>
    <div class="form-content reservation-history-page">
      <!--/* 다가오는 예약 확정(01) — 이사일 순, 없으면 숨김 */-->
      <a class="action upcoming-reservation-card" th:each="u : ${h.upcoming}" th:href="@{/reservations/{id}(id=${u.id})}" aria-label="다가오는 예약 상세">
        <div class="upcoming-reservation-top"><div><span th:text="${u.label}">예약 확정</span><b th:text="${u.dday}">D-30</b></div></div>
        <div class="upcoming-reservation-route">
          <strong th:text="${u.route}">강남구 → 서초구</strong>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </div>
        <small th:text="${u.when}">3월 18일 (수) 오전 10:00 · 원룸 / 오피스텔 · 일반포장</small>
      </a>

      <div class="reservation-past-head">
        <div class="reservation-past-title"><strong>지난 이사</strong><span th:text="${h.pastCount}">3</span></div>
        <div class="reservation-filter-wrap">
          <div class="action reservation-filter-button" role="button" tabindex="0" aria-label="지난 이사 필터 선택"
               data-filter-toggle="#reservationFilter">
            <span data-filter-label>전체</span>
            <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
          </div>
        </div>
      </div>

      <div class="past-reservation-list" data-filter-list>
        <!--/* 이사 완료(02) · 취소(03) — 이사일 최근 순, 연도별 */-->
        <section class="past-reservation-year" th:each="y : ${h.past}">
          <div class="past-reservation-year-label" th:text="${y.year}">2025년</div>
          <a class="action past-booking" th:each="p : ${y.rows}" th:classappend="${p.state}" th:attr="data-status=${p.state},aria-label=|${p.date} ${p.route} 예약 상세|"
             th:href="@{/reservations/{id}(id=${p.id})}">
            <div class="past-booking-main">
              <div class="past-booking-meta"><span th:text="${p.label}">이사 완료</span><small th:text="${p.date}">2025. 11. 02</small></div>
              <strong th:text="${p.route}">송파구 → 성동구</strong>
              <small th:text="${p.type}">원룸 / 오피스텔 · 반포장</small>
            </div>
            <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
          </a>
        </section>
        <div class="past-reservation-empty" data-filter-empty th:hidden="${h.pastCount > 0}">해당하는 예약 내역이 없어요.</div>
      </div>
    </div>
  </div>

  <!--/* 필터 바텀시트 (H08) */-->
  <div id="reservationFilter" class="filter-sheet" data-layer th:hidden="${state != 'filter'}">
    <div class="action reservation-filter-dismiss" data-close aria-label="지난 이사 필터 닫기"></div>
    <div class="reservation-filter-menu" role="menu">
      <div class="reservation-filter-handle" role="button" tabindex="0" aria-label="필터 선택 화면 닫기" data-close><span></span></div>
      <div class="reservation-filter-options">
        <div class="action selected" role="menuitem" tabindex="0" data-filter="all">전체<span>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="completed">이사 완료<span hidden>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="cancelled">취소<span hidden>✓</span></div>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/user-layout :: scripts}"></th:block>
<script th:src="@{/js/user/more.js}"></script>
</body>
</html>
