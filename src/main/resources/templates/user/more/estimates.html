<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--/* SCR-U-08x 견적내역 (G-H05~H06 / E-H05~H06)
  state: (없음) 견적내역 H05 | filter 필터 바텀시트 H06
  필터(전체·검토 중·견적 도착·견적 확정·만료)는 more.js 에서 동작
  model estimates (HistoryView.Estimates, MoreController). 없으면(미리보기 /dev) SAMPLE_ESTIMATES
*/-->
<head th:replace="~{fragments/user-layout :: head(title='견적내역', links=~{::link})}">
  <link rel="stylesheet" th:href="@{/css/user/more.css}">
</head>
<body>
<div class="app-shell" th:with="state=${param.state != null ? param.state[0] : ''}, live=${estimates != null}, h=${estimates ?: T(com.codemove.reservation.HistoryView).SAMPLE_ESTIMATES}">
  <div class="screen form-page">
    <div class="form-head">
      <a th:replace="~{fragments/user-layout :: back(href=@{/more})}"></a>
      <div class="form-title">견적내역</div>
    </div>
    <div class="form-content estimate-history-page">
      <!--/* 가장 최근 견적 도착(02) — 없으면 숨김. 남은 시간은 more.js 가 1초마다 갱신 */-->
      <a class="action estimate-arrived-card" th:if="${h.arrived != null}" th:href="@{/estimates/{id}(id=${h.arrived.id})}" aria-label="도착한 견적 상세">
        <div class="estimate-arrived-top">
          <span>견적 도착</span>
          <b th:attr="data-countdown=${live} ? ${h.arrived.expiresInSeconds} : null, data-suffix=' 남음'">
            <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.7v4.7l3.2 1.8"/></svg>
            <span data-countdown-text th:text="${h.arrived.remain}">2일 13시간 남음</span>
          </b>
        </div>
        <div class="estimate-arrived-route">
          <strong th:text="${h.arrived.route}">서초구 → 강동구</strong>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </div>
        <small th:text="${h.arrived.meta}">5월 2일 (토) 이사 · 380,000원</small>
      </a>

      <div class="estimate-list-head" data-filter-group>
        <div><strong>견적 목록</strong><span th:text="${#lists.size(h.quotes)}">4</span></div>
        <div class="estimate-filter-wrap">
          <div class="action estimate-filter-button" role="button" tabindex="0" aria-label="견적 목록 필터 선택"
               data-filter-toggle="#estimateFilter" th:classappend="${state == 'filter'} ? 'open'">
            <span data-filter-label>전체</span>
            <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
          </div>
        </div>
      </div>

      <div class="estimate-history-list" data-filter-list>
        <!--/* 검토 중 견적의 상세는 내 이사 견적 정보로 돌아간다 (MoveController) */-->
        <a class="action estimate-history-row" th:each="q : ${h.quotes}" th:classappend="${q.state}" th:attr="data-status=${q.state},aria-label=|${q.date} ${q.route} 견적 상세|"
           th:href="${live} ? @{/estimates/{id}(id=${q.id})} : (${q.state == 'confirmed'} ? @{/estimates/1(state='confirmed')} : @{/estimates/1})">
          <div class="estimate-history-main">
            <div class="estimate-history-meta"><span th:text="${q.label}">검토 중</span><small th:text="${q.date}">2026. 06. 10</small></div>
            <strong th:text="${q.route}">서초구 → 마포구</strong>
            <small th:text="${q.type}">빌라 / 주택 · 반포장</small>
          </div>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </a>
        <div class="past-reservation-empty" data-filter-empty th:hidden="${!#lists.isEmpty(h.quotes)}">해당하는 견적 내역이 없어요.</div>
      </div>
    </div>
  </div>

  <!--/* 필터 바텀시트 (H06) */-->
  <div id="estimateFilter" class="filter-sheet" data-layer th:hidden="${state != 'filter'}">
    <div class="action reservation-filter-dismiss" data-close aria-label="견적 목록 필터 닫기"></div>
    <div class="reservation-filter-menu" role="menu">
      <div class="reservation-filter-handle" role="button" tabindex="0" aria-label="필터 선택 화면 닫기" data-close><span></span></div>
      <div class="reservation-filter-options">
        <div class="action selected" role="menuitem" tabindex="0" data-filter="all">전체<span>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="reviewing">검토 중<span hidden>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="arrived">견적 도착<span hidden>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="confirmed">견적 확정<span hidden>✓</span></div>
        <div class="action" role="menuitem" tabindex="0" data-filter="expired">만료<span hidden>✓</span></div>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/user-layout :: scripts}"></th:block>
<script th:src="@{/js/user/more.js}"></script>
</body>
</html>
