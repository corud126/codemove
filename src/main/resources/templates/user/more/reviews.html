<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--/* SCR-U-08x 후기 (G-H09, G-H12 / E-H09, E-H12)
  state: (없음) 후기 목록 H09 | done 후기 등록 완료 H12 (방금 쓴 후기 + 토스트)
  model reviews (MyReviewView, TBL_REVIEW 최근 순) · reviewTarget (ReviewTargetView, 후기를 안 쓴 가장 최근 이사 완료 — 없으면 카드 없음)
  모델이 없으면(미리보기 /dev) 예시 값(SAMPLES · SAMPLE), done 이면 more.js 가 sessionStorage 의 작성 내용으로 방금 쓴 후기를 채운다
*/-->
<head th:replace="~{fragments/user-layout :: head(title='후기', links=~{::link})}">
  <link rel="stylesheet" th:href="@{/css/user/more.css}">
</head>
<body>
<div class="app-shell" th:with="state=${param.state != null ? param.state[0] : ''}, live=${reviews != null},
     list=${reviews ?: T(com.codemove.review.MyReviewView).SAMPLES},
     target=${live ? reviewTarget : T(com.codemove.review.ReviewTargetView).SAMPLE},
     preview=${!live and state == 'done'}">
  <div class="screen form-page">
    <div class="form-head">
      <a th:replace="~{fragments/user-layout :: back(href=@{/more})}"></a>
      <div class="form-title">후기</div>
    </div>
    <div class="form-content review-history-page">
      <a class="action review-prompt" th:if="${target != null}" th:href="${live} ? @{/more/reviews/new(reservation=${target.reservationId})} : @{/more/reviews/new}"
         th:attr="aria-label=${target.date} + ' 이사 후기 작성'" aria-label="3월 18일 이사 후기 작성">
        <div class="review-prompt-meta"><span>후기 작성</span><small th:text="${target.date} + ' 이사'">3월 18일 이사</small></div>
        <strong><th:block th:text="${target.routeFrom}">강남구</th:block> <i>→</i> <th:block th:text="${target.routeTo}">서초구</th:block></strong>
        <p>서비스는 만족스러우셨나요?</p>
        <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
      </a>
      <div class="history-label review-history-label">
        <strong>내가 쓴 후기</strong>
        <span th:text="${#lists.size(list) + (preview ? 1 : 0)}">1</span>
      </div>

      <!--/* 방금 쓴 후기 (H12) — 미리보기 전용. 실제로는 등록한 후기가 아래 목록 맨 위에 '방금 전'으로 나온다 */-->
      <div class="my-review submitted-review" id="submittedReview" th:if="${preview}">
        <div class="my-review-head"><span data-review-stars>★★★★★</span><small>방금 전</small></div>
        <strong>강남구 → 서초구</strong>
        <div class="my-review-copy">
          <p data-review-text>기사님들이 친절하시고 짐도 꼼꼼하게 옮겨주셨어요. 다음에도 이용할게요!</p>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </div>
        <small class="my-review-type">원룸 · 일반포장</small>
        <div class="my-review-photos" data-review-photos hidden></div>
      </div>

      <div class="my-review" th:each="r : ${list}">
        <div class="my-review-head"><span th:text="${r.stars}">★★★★★</span><small th:text="${r.date}">2025. 11. 03</small></div>
        <strong th:text="${r.route}">송파구 → 성동구</strong>
        <div class="my-review-copy">
          <p th:text="${r.content}">친절하게 응대해주시고 꼼꼼히 챙겨주셔서 편하게 이사했습니다.</p>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </div>
        <small class="my-review-type" th:text="${r.type}">원룸 · 반포장</small>
        <div class="my-review-photos" th:unless="${#lists.isEmpty(r.photos)}">
          <img th:each="p : ${r.photos}" th:src="@{${p}}" alt="후기 사진">
        </div>
        <!--/* 관리자 답변 (REPLY_CONTENT · REPLIED_AT) — 답변이 있는 후기만 */-->
        <div class="my-review-reply" th:if="${r.reply != null}">
          <div class="my-review-reply-head"><strong>사장님 답변</strong><small th:text="${r.replyDate}">2025. 11. 04</small></div>
          <p th:text="${r.reply}">소중한 후기 감사합니다. 앞으로도 안전하고 꼼꼼한 이사 서비스로 보답하겠습니다.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="save-toast" id="reviewToast" role="status" th:if="${state == 'done'}">후기가 등록되었어요.</div>
</div>
<th:block th:replace="~{fragments/user-layout :: scripts}"></th:block>
<script th:src="@{/js/user/more.js}"></script>
</body>
</html>
