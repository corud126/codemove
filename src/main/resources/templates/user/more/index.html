<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--/* SCR-U-08x 더보기 (G-H01 / E-H01)
  state: 없음
*/-->
<head th:replace="~{fragments/user-layout :: head(title='더보기', links=~{::link})}">
  <link rel="stylesheet" th:href="@{/css/user/more.css}">
</head>
<body>
<div class="app-shell">
  <div class="screen page-with-nav more-screen">
    <div th:replace="~{fragments/user-layout :: header(notificationCount=1)}"></div>

    <main class="sub-content profile-content">
      <div class="page-title">더보기</div>
      <a class="action profile-card" th:href="@{/more/profile}" aria-label="내 정보 수정">
        <div class="avatar">김</div>
        <div>
          <strong>김무브님</strong>
          <span>010-1234-5678</span>
        </div>
        <img alt="" class="chevron chevron-light" th:src="@{/images/user/ce2ac.svg}">
      </a>
      <div class="menu-list">
        <a class="action" th:href="@{/more/estimates}" aria-label="견적내역">
          <div><strong>견적내역</strong><span>받은 견적을 모아봐요</span></div>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </a>
        <a class="action" th:href="@{/more/reservations}" aria-label="예약내역">
          <div><strong>예약내역</strong><span>지난 예약을 확인해요</span></div>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </a>
        <a class="action" th:href="@{/more/reviews}" aria-label="후기">
          <div><strong>후기</strong><span>이용 후기를 작성해요</span></div>
          <img alt="" class="chevron" th:src="@{/images/user/ce2ac.svg}">
        </a>
      </div>
      <a class="action logout" th:href="@{/logout}">로그아웃</a>
    </main>

    <nav th:replace="~{fragments/user-layout :: bottomNav(active='more', locked=false)}"></nav>
  </div>
</div>
<th:block th:replace="~{fragments/user-layout :: scripts}"></th:block>
</body>
</html>
