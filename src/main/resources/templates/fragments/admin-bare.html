<!DOCTYPE html>
<!--/* 관리자 — 헤더·하단 탭이 없는 화면용 fragment (스플래시 · 로그인 · 비밀번호 변경)
  사용법: bare(title, frameClass, content, scripts) — 프레임·반응형·안전 영역은 admin-layout 과 같다 */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="bare(title, frameClass, content, scripts)" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    // 반응형 프레임 (admin-layout 과 같음)
    (function () {
      const root = document.documentElement;
      function fit() {
        const phone = innerWidth < 480;
        const zoom = phone ? innerWidth / 430 : Math.min(1, (innerHeight - 48) / 874, (innerWidth - 32) / 430);
        root.style.setProperty("--frame-zoom", zoom.toFixed(4));
        root.style.setProperty("--app-h", (phone ? innerHeight / zoom : 874).toFixed(2) + "px");
      }
      fit();
      addEventListener("resize", fit);
    })();
  </script>
  <title th:text="${title} + ' | 명품익스프레스 관리자'">명품익스프레스 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
  <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
  <link rel="stylesheet" th:href="@{/css/admin/admin-v2.css}">
</head>
<body class="admin-v2">
<main class="grid h-[100dvh] place-items-center overflow-hidden bg-[#e8ebe8]">
  <div id="adminFrame" class="relative overflow-hidden min-[480px]:rounded-[32px] min-[480px]:shadow-[0_18px_60px_rgba(39,61,43,.18)]"
       th:classappend="${frameClass}">
    <th:block th:replace="${content}"/>
  </div>
</main>
<th:block th:replace="${scripts}"/>
</body>
</html>
