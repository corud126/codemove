<!DOCTYPE html>
<!--/* 관리자 비밀번호 변경 — 첫 로그인(초기 비밀번호, PW_CHANGED_AT 없음) 시 강제 (ERD 수정안 Q10)
  조건(8자 이상 · 영문·숫자 포함 · 새 비밀번호 일치)을 모두 만족하면 [변경하고 시작하기] 활성화 → POST /admin/password → 관리자 홈 */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-bare :: bare(title='비밀번호 변경', frameClass='bg-[#f7f8f6]', content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <form id="pwForm" th:action="@{/admin/password}" method="post"
        class="flex h-full flex-col px-6 pb-[calc(28px+var(--safe-bottom))] pt-[calc(72px+var(--safe-top))]">
    <span class="grid h-12 w-12 place-items-center rounded-[16px] tone-green">
      <svg class="icon" width="26" height="26"><use th:href="@{/images/admin/icons-v2.svg} + '#i-lock'"/></svg>
    </span>
    <h1 class="mt-5 text-[24px] font-extrabold leading-[1.35] tracking-[-0.03em] text-[#1a1a1a]">새 비밀번호로<br>변경해 주세요</h1>

    <div class="mt-9 space-y-5">
      <label class="block">
        <span class="mb-2 block text-[14px] font-semibold text-[#555]">현재 비밀번호</span>
        <input id="pwCurrent" name="current" class="field-input" type="password" autocomplete="current-password">
      </label>
      <label class="block">
        <span class="mb-2 block text-[14px] font-semibold text-[#555]">새 비밀번호</span>
        <input id="pwNew" name="password" class="field-input" type="password" autocomplete="new-password">
      </label>
      <label class="block">
        <span class="mb-2 block text-[14px] font-semibold text-[#555]">새 비밀번호 확인</span>
        <input id="pwConfirm" class="field-input" type="password" autocomplete="new-password">
      </label>
    </div>

    <!--/* 조건 — 만족하면 초록으로 바뀜 */-->
    <ul class="mt-4 space-y-2 text-[14px]">
      <li th:each="r : ${ {'len|8자 이상', 'mix|영문·숫자 포함', 'same|새 비밀번호 일치'} }"
          th:with="t=${#strings.arraySplit(r, '|')}" th:attr="data-rule=${t[0]}"
          class="flex items-center gap-2 text-[#a3a8a4] transition-colors">
        <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons-v2.svg} + '#i-circleCheck'"/></svg>
        <span th:text="${t[1]}">8자 이상</span>
      </li>
    </ul>

    <div class="mt-auto">
      <button id="pwSubmit" type="submit" class="btn-primary" disabled>변경하고 시작하기</button>
    </div>
  </form>
</th:block>
<th:block th:fragment="scripts">
  <script>
    (function () {
      const cur = document.getElementById('pwCurrent');
      const pw = document.getElementById('pwNew');
      const again = document.getElementById('pwConfirm');
      const submit = document.getElementById('pwSubmit');
      const rule = (name) => document.querySelector('[data-rule="' + name + '"]');
      function update() {
        const checks = {
          len: pw.value.length >= 8,
          mix: /[A-Za-z]/.test(pw.value) && /\d/.test(pw.value),
          same: pw.value.length > 0 && pw.value === again.value
        };
        Object.entries(checks).forEach(([k, ok]) => {
          rule(k).classList.toggle('text-[#346538]', ok);
          rule(k).classList.toggle('text-[#a3a8a4]', !ok);
        });
        submit.disabled = !(cur.value && checks.len && checks.mix && checks.same);
      }
      [cur, pw, again].forEach((el) => el.addEventListener('input', update));
    })();
  </script>
</th:block>
</body>
</html>
