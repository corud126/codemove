<!DOCTYPE html>
<!--/* SCR-A-001 견적 관리 — 디자인 기준: docs/ui/관리자디자인기준.md
  상태: (기본) | ?state=date-search (A 검색 열림) | ?state=empty (B 검색 결과 없음) | ?state=delete-confirm (C 삭제 확인)
  분류 필터 · 검색(이름·날짜 YY.MM.DD) · 페이지(8건) · 삭제 · 분류별 현황은 estimate.js 에서 처리
  행: model rows (TBL_QUOTE), 삭제는 POST /admin/estimates/{id}/delete — 사진·PDF 등록 견적만 (고객 요청 견적은 삭제 없음, 11/09) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='견적 관리', active='estimate', fixed=false, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div id="estimateList" class="px-4 pb-28 pt-5" th:with="state=${param.state != null ? param.state[0] : ''}" th:attr="data-state=${state}, data-live=${rows != null}">
    <!--/* 1행: 페이지 제목만 */-->
    <h2 class="px-1 text-[22px] font-extrabold tracking-[-0.03em] text-[#1a1a1a]">견적 관리</h2>

    <!--/* 2행: 분류 필터 · 검색 · 등록 */-->
    <div class="mt-5 flex items-center gap-1">
      <div id="estimateFilter" class="inline-flex gap-0.5 rounded-full bg-[#eef0ee] p-1" role="tablist" aria-label="분류 필터">
        <button type="button" th:each="f, st : ${ {'전체|전체', '견적 검토|검토', '견적 승인|승인', '견적 확정|확정', '만료|만료'} }"
                th:with="t=${#strings.arraySplit(f, '|')}" th:attr="data-filter=${t[0]},aria-selected=${st.first}" role="tab"
                class="h-[30px] rounded-full px-2.5 text-[13px] font-semibold text-[#888] aria-selected:bg-white aria-selected:text-[#346538] aria-selected:shadow-[0_1px_4px_rgba(26,26,26,.1)]"
                th:text="${t[1]}">전체</button>
      </div>
      <button type="button" id="estimateSearchToggle" aria-label="견적 검색" aria-expanded="false"
              class="ml-auto grid h-10 w-10 place-items-center rounded-full text-[#292929] hover:bg-[#eef0ee] aria-expanded:bg-[#eef0ee]">
        <svg class="icon" width="22" height="22"><use th:href="@{/images/admin/icons-v2.svg} + '#i-search'"/></svg>
      </button>
      <a th:href="@{/admin/estimates/new}" class="flex h-9 items-center rounded-full bg-[#346538] px-4 text-[14px] font-bold text-white">등록</a>
    </div>

    <!--/* A 검색창 (이름 또는 날짜) */-->
    <div id="estimateSearchBar" hidden class="relative mt-3">
      <svg class="icon pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[#888]" width="19" height="19"><use th:href="@{/images/admin/icons-v2.svg} + '#i-search'"/></svg>
      <input id="estimateSearchInput" type="search" autocomplete="off" placeholder="이름 또는 날짜 검색"
             th:value="${state == 'empty'} ? '99.01.01' : ''"
             class="h-12 w-full rounded-[14px] bg-white pl-11 pr-11 text-[15px] text-[#1a1a1a] outline-none ring-1 ring-[#e5e7eb] placeholder:text-[#b0b4b1] focus:ring-2 focus:ring-[#346538] [&::-webkit-search-cancel-button]:hidden">
      <button type="button" id="estimateSearchClear" aria-label="검색어 지우기" class="absolute right-2 top-1/2 grid h-9 w-9 -translate-y-1/2 place-items-center rounded-full text-[#888] hover:bg-[#f0f1ef]">
        <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons-v2.svg} + '#i-x'"/></svg>
      </button>
    </div>

    <!--/* 견적 기록 (한 줄 리스트) — 행: id|분류|이름|날짜 (날짜 내림차순) */-->
    <section class="mt-4 overflow-hidden rounded-[20px] bg-white shadow-[0_2px_12px_rgba(26,26,26,.05)]">
      <div class="grid grid-cols-[84px_1fr_0.9fr_40px] items-center gap-2 border-b border-[#eef0ee] bg-[#f7f8f6] px-4 py-2.5 text-[12px] font-semibold text-[#888]">
        <span>분류</span><span>이름</span><span>날짜</span><span class="text-center">삭제</span>
      </div>
      <div id="estimateRows">
        <!--/* rows: 컨트롤러가 TBL_QUOTE 로 만든 행. 없으면(미리보기 /dev) 아래 예시 행 */-->
        <div th:each="e : ${rows ?: {'1|견적 검토|홍길동|26.03.25', '2|견적 승인|김명품|25.11.08', '3|견적 확정|이서준|25.04.17', '4|견적 검토|박서준|24.12.02',
                              '5|견적 승인|최유진|24.06.21', '6|견적 확정|정도현|23.09.14', '7|견적 검토|한지민|23.02.28', '8|견적 승인|윤서아|22.10.05',
                              '9|견적 확정|강민준|22.01.19', '10|견적 검토|송하윤|21.07.30', '11|견적 승인|임지호|21.03.12',
                              '12|만료|오지훈|25.08.22', '13|만료|배수아|24.03.07'}}"
             th:with="t=${#strings.arraySplit(e, '|')}"
             th:attr="data-row=${t[0]}, data-status=${t[1]}, data-name=${t[2]}, data-date=${t[3]}, data-href=@{/admin/estimates/{id}(id=${t[0]})}"
             role="link" tabindex="0"
             class="grid cursor-pointer grid-cols-[84px_1fr_0.9fr_40px] items-center gap-2 border-b border-[#eef0ee] px-4 py-2 transition last:border-none hover:bg-[#f7f8f6]">
          <span class="chip" data-chip
                th:classappend="${t[1] == '견적 검토'} ? 'chip-review' : (${t[1] == '견적 승인'} ? 'chip-progress' : (${t[1] == '만료'} ? 'chip-expired' : 'chip-done'))"
                th:text="${t[1]}">견적 검토</span>
          <span class="truncate text-[15px] font-semibold text-[#292929]" data-name-cell th:text="${t[2]}">홍길동</span>
          <span class="text-[13px] tabular-nums text-[#888]" data-date-cell th:text="${t[3]}">26.03.25</span>
          <!--/* 삭제는 사진·PDF 등록 견적만 (5번째 칸 Y). 고객 요청 견적은 빈칸으로 자리만 둔다 */-->
          <span th:if="${#arrays.length(t) > 4 and t[4] == 'N'}"></span>
          <button th:unless="${#arrays.length(t) > 4 and t[4] == 'N'}" type="button" data-delete th:attr="aria-label=|${t[2]} 삭제|"
                  class="grid h-10 w-10 place-items-center rounded-full text-[#888] hover:bg-[#fff1e9] hover:text-[#d8663d]">
            <svg class="icon" width="19" height="19"><use th:href="@{/images/admin/icons-v2.svg} + '#i-trash'"/></svg>
          </button>
        </div>
        <p id="estimateEmpty" hidden class="py-12 text-center text-[14px] text-[#888]">검색 결과가 없습니다.</p>
      </div>
    </section>

    <!--/* 페이지 */-->
    <div id="estimatePager" class="mt-4 flex justify-center gap-1"></div>

    <!--/* 분류별 현황 */-->
    <section class="mt-5 rounded-[20px] bg-white p-5 shadow-[0_2px_12px_rgba(26,26,26,.05)]">
      <h3 class="text-[17px] font-bold text-[#1a1a1a]">분류별 현황</h3>
      <div th:each="s : ${ {'견적 검토|bar-orange|4건 (31%)|31', '견적 승인|bar-sage|4건 (31%)|31', '견적 확정|bar-green|3건 (23%)|23', '만료|bar-muted|2건 (15%)|15'} }"
           th:with="t=${#strings.arraySplit(s, '|')}" th:attr="data-stat=${t[0]}" class="mt-4">
        <div class="flex items-center justify-between text-[14px]">
          <span class="font-semibold text-[#555]" th:text="${t[0]}">견적 검토</span>
          <span class="font-bold text-[#1a1a1a]" data-stat-text th:text="${t[2]}">4건 (36%)</span>
        </div>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-[#eef0ee]">
          <div class="h-full rounded-full transition-[width]" data-stat-bar th:classappend="${t[1]}" th:style="|width:${t[3]}%|"></div>
        </div>
      </div>
    </section>
  </div>

  <!--/* C 삭제 확인 팝업 */-->
  <div id="deleteConfirm" data-layer hidden class="absolute inset-x-0 bottom-[var(--nav)] top-[var(--hdr)] z-50 grid place-items-center bg-[#1a1a1a]/40 p-6">
    <div class="w-full rounded-[20px] bg-white p-6 text-center shadow-[0_18px_50px_rgba(26,26,26,.18)] [animation:slideUp_.2s_ease-out]">
      <p class="text-[18px] font-bold text-[#1a1a1a]">정말 삭제하시겠습니까?</p>
      <p class="mt-2 text-[14px] text-[#888]">삭제된 데이터는 복구할 수 없습니다.</p>
      <div class="mt-6 grid grid-cols-2 gap-2">
        <button type="button" data-close class="h-12 rounded-[14px] bg-[#f0f1ef] text-[15px] font-semibold text-[#555]">취소</button>
        <button type="button" id="deleteConfirmOk" class="h-12 rounded-[14px] bg-[#d8663d] text-[15px] font-semibold text-white">삭제</button>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="scripts"><script th:src="@{/js/admin/estimate.js}"></script></th:block>
</body>
</html>
