<!DOCTYPE html>
<!--/* SCR-A-002 견적 수정 (견적 관리 > 행 선택)
  상태: (기본, 승인 전) | ?state=approve-confirm (A 견적 승인 확인) | ?state=video (B 고객 영상) | ?state=no-video (C 영상 없음)
        ?state=editing (수정 모드) | ?state=save-confirm (정말 수정 확인) | ?state=approved (승인일 표시) | ?state=confirmed (견적 확정: 승인 버튼 숨김)
  문서 배율·드래그, 수정/저장, 승인 처리는 estimate.js (더미 데이터: 견적 1번 홍길동) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='견적 수정', active='estimate', fixed=false, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div id="estimateEdit" class="px-4 pb-28 pt-4"
       th:with="state=${param.state != null ? param.state[0] : ''},
                videoTab=${state == 'video' or state == 'no-video'},
                hasVideo=${state != 'no-video'},
                approved=${state == 'approved' or state == 'confirmed'}"
       th:attr="data-state=${state}, data-name='홍길동', data-id='1'">
    <div class="mb-4 flex items-center justify-between">
      <div>
        <p class="text-[9px] font-extrabold tracking-[0.12em] text-[#7a927d]">ESTIMATE DOCUMENT</p>
        <h2 class="mt-1 flex items-center gap-2 text-[19px] font-extrabold text-[#346538]">
          견적 수정
          <!--/* 승인 상태 배지: '승인 전' 또는 '승인일 YY.MM.DD' */-->
          <span id="approvalBadge" class="rounded-full px-2 py-0.5 text-[9px] font-extrabold"
                th:classappend="${approved} ? 'bg-[#edf4ed] text-[#346538]' : 'bg-[#fff4e8] text-[#ad6d32]'"
                th:text="${approved} ? '승인일 25.04.19' : '승인 전'">승인 전</span>
        </h2>
      </div>
      <a th:href="@{/admin/estimates}" aria-label="수정 닫기" class="grid h-9 w-9 place-items-center rounded-full bg-white text-[#59615b]">
        <svg class="icon" width="17" height="17"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
      </a>
    </div>

    <div data-tabs>
      <div class="mb-4 grid grid-cols-2 rounded-xl bg-white p-1 shadow-[0_4px_14px_rgba(36,58,39,.07)]">
        <button type="button" data-tab="doc" th:classappend="${videoTab} ? '' : 'is-active'"
                class="flex h-10 items-center justify-center gap-2 rounded-lg text-[11px] font-extrabold text-[#747c76] [&.is-active]:bg-[#346538] [&.is-active]:text-white">
          <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-document'"/></svg>견적서
        </button>
        <button type="button" data-tab="video" th:classappend="${videoTab} ? 'is-active' : ''"
                class="flex h-10 items-center justify-center gap-2 rounded-lg text-[11px] font-extrabold text-[#747c76] [&.is-active]:bg-[#346538] [&.is-active]:text-white">
          <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-camera'"/></svg>고객 영상
        </button>
      </div>

      <!--/* 견적서 탭 */-->
      <div data-panel="doc" th:hidden="${videoTab}">
        <th:block th:replace="~{admin/estimate/sheet :: viewer(download=true, action='수정')}"/>
        <button type="button" id="approveButton" data-open="#approveConfirm" th:hidden="${state == 'confirmed' or approved}"
                class="mt-4 h-12 w-full rounded-xl bg-[#346538] text-[12px] font-extrabold text-white shadow-[0_6px_18px_rgba(52,101,56,.2)]">견적 승인</button>
      </div>

      <!--/* 고객 영상 탭 */-->
      <div data-panel="video" th:hidden="${!videoTab}">
        <section th:if="${hasVideo}" class="overflow-hidden rounded-[20px] bg-white shadow-[0_5px_18px_rgba(36,58,39,.08)]">
          <div class="bg-[#1d251f]">
            <video class="aspect-[9/14] max-h-[520px] w-full bg-black object-contain" controls playsinline preload="metadata"
                   aria-label="홍길동 고객이 업로드한 이사 현장 영상" src="https://assets.mixkit.co/videos/15149/15149-360.mp4">
              고객 영상을 재생할 수 없는 브라우저입니다.
            </video>
          </div>
          <div class="p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="truncate text-[12px] font-extrabold text-[#343d36]">거실_주방_이삿짐.mp4</p>
                <p class="mt-1 text-[9px] font-medium text-[#8a928c]">26.03.25 오후 2:18 업로드</p>
              </div>
              <span class="shrink-0 rounded-full bg-[#edf3ed] px-2.5 py-1 text-[9px] font-extrabold text-[#346538]">고객 첨부</span>
            </div>
            <div class="mt-3 rounded-xl bg-[#f5f7f5] p-3">
              <p class="text-[10px] leading-5 text-[#626b64]">영상을 재생하며 이삿짐 양, 대형 가구, 진입로와 작업 환경을 확인하세요.</p>
            </div>
            <button type="button" data-goto-doc
                    class="mt-4 flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-[#346538] text-[11px] font-bold text-white">
              <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-edit'"/></svg>이 영상을 참고해 견적 수정
            </button>
          </div>
        </section>
        <div th:unless="${hasVideo}" class="grid min-h-[360px] place-items-center rounded-[20px] bg-white p-8 text-center shadow-[0_5px_18px_rgba(36,58,39,.06)]">
          <div>
            <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#edf3ed] text-[#346538]">
              <svg class="icon" width="25" height="25"><use th:href="@{/images/admin/icons.svg} + '#i-camera'"/></svg>
            </span>
            <p class="mt-4 text-[14px] font-extrabold text-[#343d36]">업로드된 고객 영상이 없습니다</p>
            <p class="mt-2 text-[10px] leading-5 text-[#858d87]">고객이 영상을 등록하면 이 화면에서<br>바로 확인할 수 있습니다.</p>
            <button type="button" data-goto-doc class="mt-5 rounded-xl border border-[#cfd8d0] bg-[#f8faf8] px-4 py-2.5 text-[10px] font-bold text-[#346538]">견적 정보로 돌아가기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!--/* 저장 확인 팝업 */-->
  <div id="saveConfirm" data-layer hidden class="absolute inset-x-0 bottom-[82px] top-[68px] z-50 grid place-items-center bg-[#1f2d21]/45 p-6 backdrop-blur-[2px]">
    <div class="relative w-full rounded-[20px] bg-white p-6 text-center shadow-2xl [animation:slideUp_.2s_ease-out]">
      <button type="button" aria-label="확인 창 닫기" data-close class="absolute right-5 top-5 grid h-7 w-7 place-items-center text-[#59625b]">
        <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
      </button>
      <h3 class="text-[17px] font-extrabold">정말 수정 하시겠습니까?</h3>
      <p class="mt-2 text-[10px] text-[#8b928d]">저장된 견적서는 상세 보기에도 바로 반영됩니다.</p>
      <div class="mt-6 grid grid-cols-2 gap-2">
        <button type="button" data-close class="h-11 rounded-xl border border-[#d9ded9] text-[11px] font-bold">취소</button>
        <button type="button" id="saveConfirmOk" class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white">저장</button>
      </div>
    </div>
  </div>

  <!--/* A 견적 승인 확인 팝업 */-->
  <div id="approveConfirm" data-layer hidden class="absolute inset-x-0 bottom-[82px] top-[68px] z-50 grid place-items-center bg-[#1f2d21]/45 p-6 backdrop-blur-[2px]">
    <div class="w-full rounded-[20px] bg-white p-6 text-center shadow-2xl [animation:slideUp_.2s_ease-out]">
      <h3 class="text-[17px] font-extrabold">정말로 견적을 승인하겠습니까?</h3>
      <p class="mt-2 text-[10px] text-[#8b928d]">승인하면 견적 분류가 견적 승인으로 변경됩니다.</p>
      <div class="mt-6 grid grid-cols-2 gap-2">
        <button type="button" data-close class="h-11 rounded-xl border border-[#d9ded9] text-[11px] font-bold">취소</button>
        <button type="button" id="approveConfirmOk" class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white">승인</button>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="scripts">
  <link rel="stylesheet" th:href="@{/css/admin/estimate.css}">
  <script th:src="@{/js/admin/estimate.js}"></script>
</th:block>
</body>
</html>
