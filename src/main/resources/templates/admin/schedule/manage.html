<!DOCTYPE html>
<!--/* SCR-A-022 일정 관리 — 휴무일 지정 · 공휴일 확인 (개인 일정 등록 SCR-A-021 은 뺌). 디자인 기준: docs/ui/관리자디자인기준.md
  예약 확인은 예약 일정(/admin/schedule)
  1행 제목 / 2행 글자 탭 [설정 | 연동]
    설정(채팅 설정과 같은 묶음 목록): 예약 받기 — 하루 최대 예약 'N건 ›' → 휠 시트(1~10) / 쉬는 날 — 정기 휴무 '매주 월요일 ›' → 요일 시트 · 공휴일에 쉬기 토글 / 임시 휴무 N + 추가 / 휴무 카드(정기 휴무 요일 동그라미 7개 · 공휴일에 쉬기 토글) — ERD 반영 대기 / 임시 휴무 + [날짜 추가](TBL_DAY_STATUS 하루 1건, 종류 구분 없음): 다가오는 날짜 목록(예약 있으면 '이 날 예약 N건') → 추가·수정 시트(날짜만, 예약 있는 날이면 경고) · 삭제
    연동: 공휴일 · 손 없는 날 — 외부 API(공공데이터 특일 정보 · 음력)에서 불러온 값, 월별 확인 + [다시 불러오기]만
  감사용 UPDATED_AT · ADMIN_ID 는 표시하지 않음 · 자동 알림 없음(Q23) · 저장 후 토스트
  state: (기본) 휴무일 · weekly(매주 월 + 공휴일 휴무) · past · day-add · day-edit · day-warning · holidays · saved
  더미 데이터·동작: js/admin/schedule.js (오늘 = 26.09.27 가정) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='일정 관리', active='', fixed=false, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div id="scheduleManage" class="px-4 pb-28 pt-5"
       th:with="ic=@{/images/admin/icons-v2.svg}, st=${param.state != null ? param.state[0] : ''},
                boxCls='block w-full rounded-[12px] bg-[#f5f6f4] px-3.5 text-[16px] text-[#1a1a1a] outline-none transition-colors placeholder:text-[#a9aea9] focus:bg-white focus:ring-2 focus:ring-inset focus:ring-[#346538]',
                labelCls='mb-2 block text-[15px] font-semibold text-[#292929]'"
       th:attr="data-state=${st}">
    <!--/* 1행: 페이지 제목만 */-->
    <h2 class="px-1 text-[22px] font-extrabold tracking-[-0.03em] text-[#1a1a1a]">일정 관리</h2>

    <!--/* 2행: 글자 탭 [설정 | 연동] — 목록을 거르는 필터가 아니라 화면을 나누는 탭이라 밑줄 탭 (알림 패널 탭과 같은 모양) */-->
    <div class="-mx-4 mt-4 flex gap-6 border-b border-[#e5e7eb] px-5" role="tablist" aria-label="일정 관리">
      <button type="button" th:each="v, it : ${ {'days|설정', 'holidays|연동'} }" th:with="t=${#strings.arraySplit(v, '|')}" role="tab"
              th:attr="data-tab=${t[0]}, aria-checked=${it.first}" th:text="${t[1]}"
              class="relative h-11 text-[16px] font-semibold text-[#888] after:absolute after:inset-x-0 after:-bottom-px after:h-0.5 aria-checked:font-bold aria-checked:text-[#346538] aria-checked:after:bg-[#346538]">설정</button>
    </div>

    <div data-list class="mt-6"></div>

    <!--/* 저장 · 삭제 토스트 */-->
    <div data-toast hidden class="absolute bottom-[calc(var(--nav)+16px)] left-1/2 z-30 flex -translate-x-1/2 items-center gap-2 whitespace-nowrap rounded-full bg-[#346538] px-4 py-2.5 text-[14px] font-semibold text-white shadow-[0_8px_24px_rgba(26,26,26,.2)] [animation:slideUp_.2s_ease-out]">
      <svg class="icon" width="17" height="17"><use th:href="${ic} + '#i-check'"/></svg><span data-toast-text>저장되었습니다</span>
    </div>

    <!--/* 하루 최대 예약 — 휠 시트 (채팅 설정 시간 시트와 같은 3줄 휠 · 가운데 선택 띠) */-->
    <div id="dailySheet" data-layer hidden class="absolute inset-0 z-50 flex items-end bg-[#1a1a1a]/40">
      <div role="dialog" aria-modal="true" aria-label="하루 최대 예약" class="w-full rounded-t-[24px] bg-white px-5 pb-[calc(20px+var(--safe-bottom))] pt-2 [animation:slideUp_.2s_ease-out]">
        <div class="mx-auto h-1 w-9 rounded-full bg-[#dcdfdc]"></div>
        <div class="mt-3 flex items-center justify-between">
          <h3 class="text-[18px] font-bold text-[#1a1a1a]">하루 최대 예약</h3>
          <button type="button" aria-label="닫기" data-close class="-mr-2 grid h-10 w-10 place-items-center rounded-full text-[#555] hover:bg-[#f0f1ef]">
            <svg class="icon" width="22" height="22"><use th:href="${ic} + '#i-x'"/></svg>
          </button>
        </div>
        <div class="relative mt-2" style="height:132px">
          <div class="pointer-events-none absolute inset-x-0 top-[44px] h-11 rounded-[12px] bg-[#f2f5f2]"></div>
          <div data-count-wheel role="listbox" aria-label="하루 최대 예약 건수" tabindex="0"
               class="relative h-full snap-y snap-mandatory overflow-y-auto py-[44px] [scrollbar-width:none] [mask-image:linear-gradient(transparent,#000_30%,#000_70%,transparent)] [&::-webkit-scrollbar]:hidden">
            <div th:each="n : ${#numbers.sequence(1, 10)}" role="option" th:attr="data-value=${n}" th:text="${n} + '건'"
                 class="grid h-11 snap-center place-items-center text-[18px] tabular-nums text-[#b0b4b1] aria-selected:font-bold aria-selected:text-[#1a1a1a]">1건</div>
          </div>
        </div>
        <button type="button" data-daily-save class="btn-primary mt-4">완료</button>
      </div>
    </div>

    <!--/* 정기 휴무 — 요일 고르기 시트 */-->
    <div id="weekdaySheet" data-layer hidden class="absolute inset-0 z-50 flex items-end bg-[#1a1a1a]/40">
      <div role="dialog" aria-modal="true" aria-label="정기 휴무" class="w-full rounded-t-[24px] bg-white px-5 pb-[calc(20px+var(--safe-bottom))] pt-2 [animation:slideUp_.2s_ease-out]">
        <div class="mx-auto h-1 w-9 rounded-full bg-[#dcdfdc]"></div>
        <div class="mt-3 flex items-center justify-between">
          <h3 class="text-[18px] font-bold text-[#1a1a1a]">정기 휴무</h3>
          <button type="button" aria-label="닫기" data-close class="-mr-2 grid h-10 w-10 place-items-center rounded-full text-[#555] hover:bg-[#f0f1ef]">
            <svg class="icon" width="22" height="22"><use th:href="${ic} + '#i-x'"/></svg>
          </button>
        </div>
        <div data-wd-list class="mt-5 flex justify-between"></div>
        <button type="button" data-wd-save class="btn-primary mt-6">완료</button>
      </div>
    </div>

    <!--/* 휴무일 추가·수정 시트 (TBL_DAY_STATUS) */-->
    <div id="dayStatus" data-layer hidden class="absolute inset-0 z-50 flex items-end bg-[#1a1a1a]/40">
      <div role="dialog" aria-modal="true" aria-label="휴무일" class="w-full rounded-t-[24px] bg-white px-5 pb-[calc(20px+var(--safe-bottom))] pt-2 [animation:slideUp_.2s_ease-out]">
        <div class="mx-auto h-1 w-9 rounded-full bg-[#dcdfdc]"></div>
        <div class="mt-3 flex items-center justify-between">
          <h3 class="text-[18px] font-bold text-[#1a1a1a]" data-day-title>휴무일 추가</h3>
          <button type="button" aria-label="닫기" data-close class="-mr-2 grid h-10 w-10 place-items-center rounded-full text-[#555] hover:bg-[#f0f1ef]">
            <svg class="icon" width="22" height="22"><use th:href="${ic} + '#i-x'"/></svg>
          </button>
        </div>
        <!--/* 날짜: 작은 달력에서 누름 (지난 날 · 이미 쉬는 날은 흐리게, 예약 있는 날은 크림색 점) */-->
        <p class="mt-1 flex items-baseline gap-2"><span class="text-[13px] font-semibold text-[#888]">날짜</span><span data-day-picked>날짜를 눌러 주세요</span></p>
        <div data-mini-cal class="mt-3"></div>
        <!--/* 예약 완료 건이 있는 날짜 → 경고 (Q23) */-->
        <p data-date-warning hidden class="mt-3 flex items-center gap-2 rounded-[12px] bg-[#fff3e6] px-3.5 py-3 text-[14px] font-semibold text-[#d9701a]">
          <svg class="icon shrink-0" width="18" height="18"><use th:href="${ic} + '#i-alert'"/></svg>
          <span>이 날짜에 예약 <span data-warning-count>2</span>건이 있습니다</span>
        </p>
        <div class="mt-5 flex gap-2">
          <button type="button" data-day-delete hidden class="h-14 w-24 shrink-0 rounded-[14px] bg-[#fff1e9] text-[16px] font-bold text-[#d8663d]">삭제</button>
          <button type="button" data-day-save class="btn-primary flex-1">등록</button>
        </div>
      </div>
    </div>

  </div>
</th:block>
<th:block th:fragment="scripts"><script th:src="@{/js/admin/schedule.js}"></script></th:block>
</body>
</html>
