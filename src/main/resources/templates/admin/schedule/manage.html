<!DOCTYPE html>
<!--/* SCR-A-022 일정 관리
  state: (기본) · edit(A 수정 모드) · date(B 날짜 상태 설정, 26.09.23) · confirm(C 저장 확인) · month(년·월 선택) · month-year(년 목록 펼침)
  수정 모드에서 날짜 클릭 → 이사 예약 불가능 / 업체 휴무일 지정 → [수정 완료] → 저장(sessionStorage, 일정 캘린더에 반영) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='일정 관리', active='', fixed=false, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div id="scheduleManage" class="px-4 pb-28 pt-6" th:data-state="${st}"
       th:with="ic=@{/images/admin/icons.svg}, st=${param.state != null ? param.state[0] : ''}">
    <h2 class="px-1 text-[24px] font-extrabold tracking-[-0.04em] text-[#346538]">일정 관리</h2>

    <!--/* ① 이전·다음 달 · ② 연필(수정 모드) · ③ 날짜 배지 · ④ 범례 */-->
    <section class="mt-5 rounded-[20px] bg-white p-4 shadow-[0_5px_18px_rgba(36,58,39,.06)]">
      <div class="relative flex items-center justify-center gap-4">
        <button type="button" aria-label="이전 달" data-month-step="-1" class="grid h-8 w-8 rotate-180 place-items-center text-[#586159]">
          <svg class="icon" width="17" height="17"><use th:href="${ic} + '#i-arrowRight'"/></svg>
        </button>
        <button type="button" data-open-month class="flex items-center gap-1 text-[15px] font-extrabold text-[#29312b]">
          <span data-month-label>2026년 9월</span>
          <svg class="icon" width="14" height="14"><use th:href="${ic} + '#i-chevron'"/></svg>
        </button>
        <button type="button" aria-label="다음 달" data-month-step="1" class="grid h-8 w-8 place-items-center text-[#586159]">
          <svg class="icon" width="17" height="17"><use th:href="${ic} + '#i-arrowRight'"/></svg>
        </button>
        <button type="button" aria-label="일정 수정" data-edit-start class="absolute right-0 grid h-8 w-8 place-items-center text-[#346538]">
          <svg class="icon" width="17" height="17"><use th:href="${ic} + '#i-edit'"/></svg>
        </button>
        <button type="button" data-edit-done hidden class="absolute right-0 text-[10px] font-extrabold text-[#346538]">수정 완료</button>
      </div>
      <div class="mt-4 grid grid-cols-7 text-center text-[9px] font-bold">
        <span class="text-[#c85f57]">일</span><span class="text-[#858d87]">월</span><span class="text-[#858d87]">화</span><span class="text-[#858d87]">수</span><span class="text-[#858d87]">목</span><span class="text-[#858d87]">금</span><span class="text-[#557fa3]">토</span>
      </div>
      <div data-cal-grid class="mt-2 grid grid-cols-7"></div>
      <div class="mt-4 flex gap-4 border-t border-[#edf0ed] pt-3 text-[8px] text-[#727a74]">
        <span><b class="mr-1 inline-block h-2 w-2 bg-[#343a35]"></b>업체 휴무일</span>
        <span><b class="mr-1 inline-block h-2 w-2 bg-[#F57C00]"></b>이사 예약 불가능</span>
      </div>
    </section>

    <!--/* A · 수정 모드 안내 */-->
    <div data-edit-pill hidden class="absolute bottom-[92px] left-1/2 z-30 flex -translate-x-1/2 items-center gap-2 whitespace-nowrap rounded-full bg-[#263129]/85 px-4 py-2.5 text-[10px] font-bold text-white shadow-lg">
      <svg class="icon" width="14" height="14"><use th:href="${ic} + '#i-edit'"/></svg>
      현재 수정 중입니다
    </div>

    <!--/* 저장 완료 토스트 */-->
    <div data-toast hidden class="absolute bottom-[92px] left-1/2 z-30 -translate-x-1/2 whitespace-nowrap rounded-full bg-[#346538] px-4 py-2.5 text-[10px] font-bold text-white shadow-lg [animation:slideUp_.2s_ease-out]">
      저장되었습니다 · 자동 알림이 발송되었습니다
    </div>

    <!--/* B · 날짜 상태 설정 */-->
    <div id="dateStatus" data-layer hidden class="absolute inset-x-0 bottom-[82px] top-[68px] z-50 grid place-items-center bg-[#1f2d21]/45 p-5 backdrop-blur-[2px]">
      <div class="w-full rounded-[20px] bg-white p-5 shadow-2xl">
        <div class="flex items-center justify-between">
          <h3 class="text-[17px] font-extrabold">날짜 상태 설정</h3>
          <button type="button" aria-label="닫기" data-close><svg class="icon" width="18" height="18"><use th:href="${ic} + '#i-x'"/></svg></button>
        </div>
        <p class="mt-2 text-[10px] text-[#858d87]" data-date-key>26.09.23</p>
        <div class="mt-5 space-y-3">
          <label th:each="s : ${ {'unavailable|이사 예약 불가능', 'closed|업체 휴무일'} }" th:with="t=${#strings.arraySplit(s, '|')}"
                 class="flex cursor-pointer items-center gap-3 rounded-xl border border-[#dfe4df] p-4 text-[12px] font-bold has-[:checked]:border-[#346538] has-[:checked]:bg-[#edf3ed]">
            <input type="radio" name="dateStatus" class="accent-[#346538]" th:value="${t[0]}" th:checked="${t[0] == 'unavailable'}">
            <span th:text="${t[1]}">이사 예약 불가능</span>
          </label>
        </div>
        <div data-date-actions class="mt-5 grid grid-cols-1 gap-2">
          <button type="button" data-date-clear hidden class="h-11 rounded-xl border border-[#d9ded9] text-[11px] font-bold text-[#59625b]">등록 취소</button>
          <button type="button" data-date-save class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white">등록</button>
        </div>
      </div>
    </div>

    <!--/* C · 저장 확인 */-->
    <div id="saveConfirm" data-layer hidden class="absolute inset-x-0 bottom-[82px] top-[68px] z-50 grid place-items-center bg-[#1f2d21]/45 p-6 backdrop-blur-[2px]">
      <div class="relative w-full rounded-[20px] bg-white p-6 text-center shadow-2xl">
        <button type="button" aria-label="확인 창 닫기" data-close class="absolute right-5 top-5 grid h-7 w-7 place-items-center text-[#59625b]">
          <svg class="icon" width="18" height="18"><use th:href="${ic} + '#i-x'"/></svg>
        </button>
        <h3 class="text-[17px] font-extrabold">정말 수정 하시겠습니까?</h3>
        <p class="mt-2 text-[10px] text-[#8b928d]">수정된 데이터는 복구할 수 없습니다.</p>
        <div class="mt-6 grid grid-cols-2 gap-2">
          <button type="button" data-edit-cancel class="h-11 rounded-xl border border-[#d9ded9] text-[11px] font-bold">취소</button>
          <button type="button" data-edit-save class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white">저장</button>
        </div>
      </div>
    </div>

    <!--/* 년·월 선택 */-->
    <div id="monthPicker" data-layer hidden class="absolute inset-x-0 bottom-[82px] top-[68px] z-50 grid place-items-center bg-[#1f2d21]/45 p-5">
      <div class="w-full rounded-[20px] bg-white p-5">
        <button type="button" data-grid-toggle class="mx-auto flex items-center gap-1 text-[16px] font-extrabold">
          <span data-temp-label>2026년 9월</span>
          <svg class="icon rotate-180" width="15" height="15"><use th:href="${ic} + '#i-chevron'"/></svg>
        </button>
        <!--/* 년·월 드롭다운 (년 2015~2035) — schedule.js 가 목록을 그린다 */-->
        <div data-picker-select class="relative mt-5 grid grid-cols-2 gap-2">
          <div th:each="k : ${ {'year|2026년', 'month|9월'} }" th:with="t=${#strings.arraySplit(k, '|')}" th:attr="data-dd=${t[0]}" class="relative">
            <button type="button" data-dd-toggle aria-expanded="false"
                    class="flex h-12 w-full items-center justify-center gap-1 rounded-xl bg-[#f5f6f5] text-[12px] font-bold">
              <span data-dd-label th:text="${t[1]}">2026년</span>
              <svg class="icon" width="13" height="13"><use th:href="${ic} + '#i-chevron'"/></svg>
            </button>
            <div data-dd-list hidden class="absolute left-0 right-0 top-14 z-20 max-h-44 overflow-y-auto rounded-xl border border-[#dfe4df] bg-white p-1.5 shadow-[0_10px_28px_rgba(36,58,39,.16)]"></div>
          </div>
        </div>
        <div data-picker-grid hidden class="mt-5 grid grid-cols-3 gap-2"></div>
        <div class="mt-5 grid grid-cols-2 gap-2">
          <button type="button" data-close class="h-11 rounded-xl border border-[#d9ded9] text-[11px] font-bold">취소</button>
          <button type="button" data-month-apply class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white">완료</button>
        </div>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="scripts"><script th:src="@{/js/admin/schedule.js}"></script></th:block>
</body>
</html>
