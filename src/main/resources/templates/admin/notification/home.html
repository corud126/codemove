<!DOCTYPE html>
<!--/* SCR-A-013 알림 관리
  state: (기본) 정상 운영 · paused(전체 자동 메시징 꺼짐 상태 표시) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='알림 관리', active='', fixed=false, content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content">
  <div class="icons-2 px-4 pb-28 pt-5" th:with="paused=${param.state != null and param.state[0] == 'paused'}">
    <div class="mb-5">
      <p class="text-[10px] font-bold tracking-[0.12em] text-[#879189]">MESSAGE SERVICE</p>
      <h2 class="mt-1 text-xl font-extrabold tracking-[-0.04em] text-[#346538]">알림 관리</h2>
    </div>

    <!--/* ① 자동 메시징 발송 현황 */-->
    <section class="rounded-[22px] border border-white bg-white p-5 shadow-[0_8px_24px_rgba(36,58,39,.08)]">
      <div class="flex items-center gap-2">
        <span class="grid h-8 w-8 place-items-center rounded-xl bg-[#edf3ed] text-[#346538]">
          <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-bell'"/></svg>
        </span>
        <h3 class="text-sm font-extrabold text-[#3a403b]">자동 메시징 발송 현황</h3>
      </div>
      <div class="py-7 text-center">
        <strong class="text-[42px] font-extrabold tracking-[-0.06em] text-[#346538]">45<span class="ml-1 text-lg tracking-normal">건</span></strong>
        <p class="mt-2 text-xs font-semibold text-[#768078]">오늘 발송된 자동 알림 메시지 수</p>
      </div>
      <div th:unless="${paused}" class="flex items-center justify-center gap-2 rounded-xl bg-[#f2f6f2] py-2.5 text-[10px] font-bold text-[#59705c]">
        <span class="h-2 w-2 rounded-full bg-[#4f8b55]"></span>
        자동 메시징 시스템 정상 운영 중
      </div>
      <div th:if="${paused}" class="flex items-center justify-center gap-2 rounded-xl bg-[#fff0ee] py-2.5 text-[10px] font-bold text-[#a84a42]">
        <span class="h-2 w-2 rounded-full bg-[#d95c50]"></span>
        자동 메시징 일시 정지 중
      </div>
    </section>

    <!--/* ② 알림 내역 · ③ 자동 메시징 관리 */-->
    <div class="mt-5 space-y-3">
      <a th:each="m : ${ {'document|알림 내역|관리자·사용자 상단 팝업 알림 기록 확인|/admin/notifications/history', 'settings|자동 메시징 관리|자동 알림 운영 상태와 발송 환경 관리|/admin/notifications/settings'} }"
         th:with="t=${#strings.arraySplit(m, '|')}" th:href="@{${t[3]}}"
         class="flex w-full items-center gap-4 rounded-[18px] border border-white bg-white p-4 text-left shadow-[0_5px_18px_rgba(36,58,39,.06)] transition active:scale-[.99]">
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#edf3ed] text-[#346538]">
          <svg class="icon" width="22" height="22"><use th:href="@{/images/admin/icons.svg} + '#i-' + ${t[0]}"/></svg>
        </span>
        <span class="min-w-0 flex-1">
          <strong class="block text-sm text-[#2e3630]" th:text="${t[1]}">알림 내역</strong>
          <span class="mt-1 block text-xs leading-5 text-[#858d87]" th:text="${t[2]}">설명</span>
        </span>
        <svg class="icon text-[#9aa19b]" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-arrowRight'"/></svg>
      </a>
    </div>
  </div>
</th:block>
</body>
</html>
