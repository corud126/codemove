<!DOCTYPE html>
<!--/* SCR-A-005 채팅 관리
  state: (기본) 대기 5건 · empty(대기 상담 없음 · 결과없음) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='채팅 관리', active='', fixed=false, content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content">
  <div class="icons-2 px-4 pb-28 pt-5" th:with="empty=${param.state != null and param.state[0] == 'empty'}">
    <div class="mb-5">
      <p class="text-[10px] font-bold tracking-[0.12em] text-[#879189]">CHAT SERVICE</p>
      <h2 class="mt-1 text-xl font-extrabold tracking-[-0.04em] text-[#253328]">채팅 관리</h2>
    </div>

    <!--/* ① 실시간 상담 현황 · ② 대기 상담 바로 확인 */-->
    <section class="rounded-[22px] border border-[#f2dedb] bg-white p-5 shadow-[0_8px_24px_rgba(89,54,48,.08)]"
             th:classappend="${empty} ? 'border-white'">
      <div class="flex items-center gap-2 text-[#a8433b]">
        <span class="grid h-8 w-8 place-items-center rounded-xl bg-[#fff0ee]">
          <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-alert'"/></svg>
        </span>
        <h3 class="text-sm font-extrabold text-[#3a403b]">실시간 상담 현황</h3>
      </div>
      <div class="py-6 text-center">
        <strong class="text-[42px] font-extrabold tracking-[-0.06em]"
                th:classappend="${empty} ? 'text-[#9aa19b]' : 'text-[#c34f45]'"><span th:text="${empty} ? 0 : 5">5</span><span class="ml-1 text-lg tracking-normal">건</span></strong>
        <p class="mt-2 text-xs font-semibold" th:classappend="${empty} ? 'text-[#8a918c]' : 'text-[#8a615d]'"
           th:text="${empty} ? '대기 중인 상담이 없습니다' : '손님 대기 중 (상담원 전환 필요)'">손님 대기 중 (상담원 전환 필요)</p>
      </div>
      <a th:href="@{/admin/chats/list(filter='waiting')}"
         class="flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-[#fff0ee] text-xs font-bold text-[#b64b42]"
         th:classappend="${empty} ? 'pointer-events-none !bg-[#f2f4f2] !text-[#a3aaa4]'">
        대기 상담 바로 확인
        <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-arrowRight'"/></svg>
      </a>
    </section>

    <!--/* ③ 채팅 내역 · ④ 운영 설정 · ⑤ 첫화면/퀵메뉴 · ⑥ AI챗봇 대화 내역 관리 */-->
    <div class="mt-5 space-y-3">
      <a th:each="m : ${ {'chat|채팅 내역|모든 손님 대화 목록|/admin/chats/list', 'settings|채팅 운영 설정|챗봇 켜기/끄기, 운영 시간, 실패 시 대응|/admin/chats/settings', 'menu|첫화면/퀵메뉴 설정|인사말과 고객용 바로가기 메뉴 구성|/admin/chats/entry', 'robot|AI챗봇 대화 내역 관리|주제별 AI 답변과 로어북 관리|/admin/chats/answers'} }"
         th:with="t=${#strings.arraySplit(m, '|')}" th:href="@{${t[3]}}"
         class="flex w-full items-center gap-4 rounded-[18px] border border-white bg-white p-4 text-left shadow-[0_5px_18px_rgba(36,58,39,.06)] transition active:scale-[.99]">
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#edf3ed] text-[#346538]">
          <svg class="icon" width="22" height="22"><use th:href="@{/images/admin/icons.svg} + '#i-' + ${t[0]}"/></svg>
        </span>
        <span class="min-w-0 flex-1">
          <strong class="block text-sm text-[#2e3630]" th:text="${t[1]}">채팅 내역</strong>
          <span class="mt-1 block text-xs text-[#858d87]" th:classappend="${t[0] != 'chat'} ? 'leading-5'" th:text="${t[2]}">모든 손님 대화 목록</span>
        </span>
        <span th:if="${t[0] == 'chat' and !empty}"
              class="grid h-6 min-w-6 place-items-center rounded-full bg-[#346538] px-1.5 text-[10px] font-extrabold text-white">14</span>
        <svg class="icon text-[#9aa19b]" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-arrowRight'"/></svg>
      </a>
    </div>
  </div>
</th:block>
</body>
</html>
