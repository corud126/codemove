<!DOCTYPE html>
<!--/* SCR-A-010 답변 설정 관리
  state: (기본) 첫 주제 펼침 · register(A 답변 등록 · 필수 미입력 비활성) · edit(답변 수정) · delete(삭제 확인) · empty(검색 결과 없음) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='답변 설정 관리', active='', fixed=true, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div class="icons-2 relative flex h-full min-h-0 flex-col overflow-hidden bg-[#f5f6f8]" data-chat-answers>
    <header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white">
      <h2 class="text-base font-extrabold text-[#29322b]">답변 설정 관리</h2>
      <a th:href="@{/admin/chats}" aria-label="답변 설정 닫기" class="absolute right-3 grid h-10 w-10 place-items-center rounded-full text-[#525c54] hover:bg-[#f2f4f2]">
        <svg class="icon" width="20" height="20"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
      </a>
    </header>

    <!--/* ① 검색 · ② + 등록 */-->
    <div class="flex shrink-0 items-center gap-2 p-4 pb-2">
      <label class="flex min-w-0 flex-1 items-center gap-2 rounded-full bg-white px-4 py-3 shadow-[0_3px_12px_rgba(36,58,39,.05)]">
        <svg class="icon text-[#8b928d]" width="17" height="17"><use th:href="@{/images/admin/icons.svg} + '#i-search'"/></svg>
        <input type="search" data-topic-query placeholder="검색어를 입력하세요" aria-label="답변 주제 검색"
               class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-[#9ca29e]">
      </label>
      <button type="button" data-topic-new class="h-11 shrink-0 rounded-full bg-[#346538] px-4 text-xs font-bold text-white">+ 등록</button>
    </div>

    <!--/* ③ 주제 카드 클릭 → 펼침 · ④ 수정 · ⑤ 삭제 */-->
    <div class="min-h-0 flex-1 overflow-y-auto p-4 pt-2">
      <div class="space-y-2" data-topics>
        <section th:each="tp, s : ${ {'이사 견적|이사 비용과 방문 견적 과정을 안내합니다.|#견적#비용#가격|출발지와 도착지, 이사 날짜, 짐의 양을 알려주시면 예상 견적을 안내해 드립니다.', '예약 방법|상담부터 예약 확정까지의 절차를 안내합니다.|#예약#신청#계약|견적 확인 후 예약금을 결제하면 이사 일정이 최종 확정됩니다.', '포장 이사|포장 서비스 범위와 준비 사항을 확인합니다.|#포장#박스#정리|포장 이사는 전문 인력이 포장부터 운반, 기본 정리까지 진행합니다.', '사다리차 이용|사다리차 필요 여부와 추가 비용을 안내합니다.|#사다리차#엘리베이터#고층|현장 층수와 작업 환경에 따라 사다리차 필요 여부 및 비용이 달라집니다.'} }"
                 th:with="t=${#strings.arraySplit(tp, '|')}" th:attr="data-topic=${s.count}"
                 class="overflow-hidden rounded-2xl border border-white bg-white shadow-[0_3px_12px_rgba(36,58,39,.05)]">
          <div role="button" tabindex="0" data-topic-toggle th:attr="aria-expanded=${s.first}" class="flex w-full cursor-pointer items-center gap-2 p-4 text-left">
            <span class="min-w-0 flex-1">
              <strong class="block text-sm text-[#303832]" data-topic-title th:text="${t[0]}">이사 견적</strong>
              <span class="mt-1 block truncate text-xs text-[#8a918c]" data-topic-intro th:text="${t[1]}">소개</span>
            </span>
            <button type="button" data-topic-edit th:attr="aria-label=${t[0]} + ' 수정'" class="grid h-8 w-8 place-items-center rounded-lg bg-[#f2f5f2] text-[#346538]">
              <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-edit'"/></svg>
            </button>
            <button type="button" data-topic-delete th:attr="aria-label=${t[0]} + ' 삭제'" class="grid h-8 w-8 place-items-center rounded-lg bg-[#fff0ee] text-[#b64b42]">
              <svg class="icon" width="15" height="15"><use th:href="@{/images/admin/icons.svg} + '#i-trash'"/></svg>
            </button>
          </div>
          <div data-topic-body th:hidden="${!s.first}" class="border-t border-[#edf0ed] bg-[#fafbfa] px-4 py-3">
            <div class="mb-3 last:mb-0" data-lorebook th:attr="data-keywords=${t[2]}">
              <div class="flex flex-wrap gap-1">
                <span th:each="k : ${#strings.arraySplit(t[2], '#')}" class="rounded-full bg-[#e9f1e9] px-2 py-1 text-[10px] font-bold text-[#346538]" th:text="'#' + ${k}">#견적</span>
              </div>
              <p class="mt-2 text-xs leading-5 text-[#626a64]" data-lorebook-content th:text="${t[3]}">내용</p>
            </div>
          </div>
        </section>
      </div>
      <p data-empty hidden class="py-16 text-center text-sm text-[#858d87]">검색 결과가 없습니다.</p>
    </div>

    <!--/* A. 답변 등록 / 수정 */-->
    <div id="topicEditor" data-layer hidden class="absolute inset-0 z-40 flex flex-col bg-[#f5f6f8]">
      <header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white">
        <h3 class="text-base font-extrabold text-[#303832]" data-editor-title>답변 등록</h3>
        <button type="button" aria-label="답변 편집 닫기" data-close class="absolute right-3 grid h-10 w-10 place-items-center rounded-full">
          <svg class="icon" width="20" height="20"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
        </button>
      </header>
      <div class="min-h-0 flex-1 overflow-y-auto p-4">
        <section class="space-y-3 rounded-[18px] bg-white p-4">
          <input type="text" data-draft-title placeholder="주제 제목을 입력하세요" aria-label="주제 제목"
                 class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-sm font-semibold outline-none focus:border-[#89a18b]">
          <textarea data-draft-intro placeholder="주제 제목과 함께 보일 짧은 소개를 입력해주세요" aria-label="주제 소개"
                    class="h-24 w-full resize-none rounded-xl border border-[#dfe4df] bg-[#f7f8f7] p-3 text-sm leading-5 outline-none focus:border-[#89a18b]"></textarea>
        </section>
        <div class="mb-3 mt-5 flex items-center justify-between">
          <div>
            <h4 class="text-sm font-extrabold text-[#303832]">로어북</h4>
            <p class="mt-1 text-[10px] text-[#8a918c]">키워드에 따라 AI에게 전달할 내용을 설정합니다</p>
          </div>
          <button type="button" data-lorebook-add class="rounded-xl bg-[#edf3ed] px-3 py-2 text-xs font-bold text-[#346538]">+ 등록</button>
        </div>
        <div class="space-y-3" data-lorebooks></div>
      </div>
      <div class="shrink-0 border-t border-[#e5e9e5] bg-white p-3">
        <button type="button" data-topic-save disabled
                class="h-12 w-full rounded-xl bg-[#346538] text-sm font-extrabold text-white disabled:bg-[#bcc5bd]">등록</button>
      </div>
    </div>

    <!--/* ⑤ 삭제 확인 */-->
    <div id="topicDeleteModal" data-layer hidden class="absolute inset-0 z-50 grid place-items-center bg-[#1f2d21]/45 p-6 backdrop-blur-[2px]">
      <div role="alertdialog" aria-modal="true" class="w-full rounded-[22px] bg-white p-5 text-center shadow-[0_20px_50px_rgba(25,42,28,.24)]">
        <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-[#fff0ee] text-[#b64b42]">
          <svg class="icon" width="21" height="21"><use th:href="@{/images/admin/icons.svg} + '#i-trash'"/></svg>
        </span>
        <h3 class="mt-4 text-base font-extrabold text-[#303832]">정말 삭제하시겠습니까?</h3>
        <p class="mt-2 text-xs text-[#8a918c]">삭제된 데이터는 복구할 수 없습니다.</p>
        <div class="mt-5 grid grid-cols-2 gap-2">
          <button type="button" data-close class="h-11 rounded-xl bg-[#f0f2f0] text-sm font-bold text-[#646c66]">취소</button>
          <button type="button" data-topic-delete-confirm class="h-11 rounded-xl bg-[#c65249] text-sm font-bold text-white">삭제</button>
        </div>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="scripts"><script th:src="@{/js/admin/chat.js}"></script></th:block>
</body>
</html>
