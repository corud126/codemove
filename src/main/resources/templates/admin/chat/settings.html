<!DOCTYPE html>
<!--/* SCR-A-008 채팅 운영 설정
  state: (기본) · rule(A 대응 규칙 수정 팝업) · time(시작 시간 선택 시트) · off(챗봇·운영 시간 꺼짐) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='채팅 운영 설정', active='', fixed=true, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content">
  <div class="icons-2 relative flex h-full min-h-0 flex-col overflow-hidden bg-[#f5f6f8]" data-chat-settings>
    <header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white px-4">
      <h2 class="text-base font-extrabold text-[#29322b]">채팅 운영 설정</h2>
      <a th:href="@{/admin/chats}" aria-label="운영 설정 닫기"
         class="absolute right-3 grid h-10 w-10 place-items-center rounded-full text-[#525c54] hover:bg-[#f2f4f2]">
        <svg class="icon" width="20" height="20"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
      </a>
    </header>

    <div class="min-h-0 flex-1 space-y-3 overflow-y-auto p-4">
      <!--/* ① 챗봇 가동 */-->
      <section class="rounded-[18px] bg-white p-4 shadow-[0_4px_16px_rgba(36,58,39,.05)]">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 place-items-center rounded-2xl bg-[#edf3ed] text-[#346538]">
            <svg class="icon" width="21" height="21"><use th:href="@{/images/admin/icons.svg} + '#i-robot'"/></svg>
          </span>
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-extrabold text-[#303832]">챗봇 가동</h3>
            <p class="mt-1 text-[11px] text-[#8a918c]">AI가 고객 문의에 자동으로 답변합니다</p>
          </div>
          <button type="button" aria-label="챗봇 가동" aria-pressed="true" data-toggle="enabled"
                  class="group relative h-7 w-12 shrink-0 rounded-full bg-[#d8ddd9] transition aria-pressed:bg-[#346538]">
            <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow-sm transition-transform group-aria-pressed:translate-x-5"></span>
          </button>
        </div>
      </section>

      <!--/* ② 운영 시간 · ③ 시작/종료 시간 */-->
      <section class="rounded-[18px] bg-white p-4 shadow-[0_4px_16px_rgba(36,58,39,.05)]">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 place-items-center rounded-2xl bg-[#edf3ed] text-[#346538]">
            <svg class="icon" width="21" height="21"><use th:href="@{/images/admin/icons.svg} + '#i-clock'"/></svg>
          </span>
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-extrabold text-[#303832]">운영 시간</h3>
            <p class="mt-1 text-[11px] text-[#8a918c]">관리자 응대 가능 시간을 설정합니다</p>
          </div>
          <button type="button" aria-label="운영 시간 사용" aria-pressed="true" data-toggle="hours"
                  class="group relative h-7 w-12 shrink-0 rounded-full bg-[#d8ddd9] transition aria-pressed:bg-[#346538]">
            <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow-sm transition-transform group-aria-pressed:translate-x-5"></span>
          </button>
        </div>
        <div class="mt-4 grid grid-cols-[1fr_auto_1fr] items-center gap-2">
          <button type="button" data-time="start"
                  class="rounded-xl bg-[#f3f5f3] px-3 py-3 text-center text-sm font-extrabold text-[#346538] disabled:text-[#a7aea8]">09:00</button>
          <span class="text-xs font-semibold text-[#9aa19b]">~</span>
          <button type="button" data-time="end"
                  class="rounded-xl bg-[#f3f5f3] px-3 py-3 text-center text-sm font-extrabold text-[#346538] disabled:text-[#a7aea8]">18:00</button>
        </div>
      </section>

      <!--/* ④ 대응 규칙 */-->
      <section class="rounded-[18px] bg-white p-4 shadow-[0_4px_16px_rgba(36,58,39,.05)]">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 place-items-center rounded-2xl bg-[#fff5e8] text-[#9d6c2f]">
            <svg class="icon" width="21" height="21"><use th:href="@{/images/admin/icons.svg} + '#i-help'"/></svg>
          </span>
          <div class="min-w-0 flex-1">
            <h3 class="text-sm font-extrabold text-[#303832]">대응 규칙</h3>
            <p class="mt-1 truncate text-[11px] text-[#8a918c]" data-rule-text>현재 상담원 연결이 지연되고 있습니다. 조금만 기다려주세요.</p>
          </div>
          <button type="button" aria-label="대응 규칙 수정" data-rule-open
                  class="grid h-10 w-10 place-items-center rounded-xl bg-[#f3f5f3] text-[#346538]">
            <svg class="icon" width="18" height="18"><use th:href="@{/images/admin/icons.svg} + '#i-edit'"/></svg>
          </button>
        </div>
      </section>
    </div>

    <!--/* ③ 시간 선택 (오전/오후 · 시 · 분) */-->
    <div id="timeSheet" data-layer hidden class="absolute inset-0 z-40 flex items-end bg-[#1f2d21]/45 backdrop-blur-[2px]">
      <div class="w-full rounded-t-[24px] bg-white px-5 pb-6 pt-4 shadow-[0_-18px_50px_rgba(25,42,28,.22)] [animation:slideUp_.2s_ease-out]">
        <div class="flex items-center justify-between">
          <button type="button" data-close class="px-2 py-2 text-sm font-semibold text-[#828a84]">취소</button>
          <h3 class="text-sm font-extrabold text-[#303832]" data-time-title>시작 시간</h3>
          <button type="button" data-time-save class="px-2 py-2 text-sm font-extrabold text-[#346538]">완료</button>
        </div>
        <div class="relative mt-4 grid grid-cols-3 gap-2 overflow-hidden rounded-2xl bg-[#f5f6f5] p-3">
          <div class="pointer-events-none absolute inset-x-3 top-1/2 h-11 -translate-y-1/2 rounded-xl border-y border-[#dfe4df] bg-white/70"></div>
          <select aria-label="오전 오후" size="3" data-pick="period"
                  class="relative z-10 h-32 bg-transparent text-center text-base font-bold outline-none [&>option]:py-2 [&>option:checked]:bg-transparent [&>option:checked]:text-[#346538]">
            <option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option><option>오전</option><option>오후</option><option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option>
          </select>
          <select aria-label="시" size="3" data-pick="hour"
                  class="relative z-10 h-32 bg-transparent text-center text-base font-bold outline-none [&>option]:py-2 [&>option:checked]:bg-transparent [&>option:checked]:text-[#346538]">
            <option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option>
            <option th:each="h : ${#numbers.sequence(1, 12)}" th:value="${#numbers.formatInteger(h, 2)}" th:text="${#numbers.formatInteger(h, 2)} + '시'">01시</option>
            <option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option>
          </select>
          <select aria-label="분" size="3" data-pick="minute"
                  class="relative z-10 h-32 bg-transparent text-center text-base font-bold outline-none [&>option]:py-2 [&>option:checked]:bg-transparent [&>option:checked]:text-[#346538]">
            <option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option>
            <option th:each="m : ${ {'00','10','20','30','40','50'} }" th:value="${m}" th:text="${m} + '분'">00분</option>
            <option disabled aria-hidden="true">&nbsp;</option><option disabled aria-hidden="true">&nbsp;</option>
          </select>
        </div>
        <p class="mt-3 text-center text-[10px] text-[#8d958f]">각 항목을 위아래로 스크롤해 시간을 맞춰 주세요.</p>
      </div>
    </div>

    <!--/* A. 대응 규칙 수정 */-->
    <div id="ruleModal" data-layer hidden class="absolute inset-0 z-40 grid place-items-center bg-[#1f2d21]/45 p-5 backdrop-blur-[2px]">
      <div role="dialog" aria-modal="true" class="w-full rounded-[22px] bg-white p-5 shadow-[0_20px_50px_rgba(25,42,28,.24)]">
        <div class="relative flex items-center justify-center">
          <h3 class="text-base font-extrabold text-[#303832]">대응 규칙</h3>
          <button type="button" aria-label="대응 규칙 닫기" data-close class="absolute right-0 grid h-8 w-8 place-items-center rounded-full hover:bg-[#f2f3f2]">
            <svg class="icon" width="17" height="17"><use th:href="@{/images/admin/icons.svg} + '#i-x'"/></svg>
          </button>
        </div>
        <label class="mt-5 block">
          <span class="mb-2 block text-xs font-bold text-[#4c554e]">안내 문구 <span class="text-[#c34f45]">*</span></span>
          <textarea data-rule-input placeholder="현재 상담원 연결이 지연되고 있습니다. 조금만 기다려주세요."
                    class="h-32 w-full resize-none rounded-2xl border border-[#dfe4df] bg-[#f7f8f7] p-3 text-sm leading-6 text-[#303832] outline-none placeholder:text-[#9ca39d] focus:border-[#89a18b]"></textarea>
        </label>
        <button type="button" data-rule-save
                class="mt-4 h-12 w-full rounded-xl bg-[#346538] text-sm font-extrabold text-white disabled:bg-[#bcc5bd]">등록</button>
      </div>
    </div>
  </div>
</th:block>
<th:block th:fragment="scripts"><script th:src="@{/js/admin/chat.js}"></script></th:block>
</body>
</html>
