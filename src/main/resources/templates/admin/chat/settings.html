<!DOCTYPE html>
<!--/* 채팅 설정 (SCR-A-008 채팅 운영 설정 + 채팅 관리 메뉴 통합) — 디자인 기준: docs/ui/관리자디자인기준.md (실제 화면: admin/chat/settings.html)
  진입: 채팅 목록(chat-list) 헤더 톱니바퀴 → 뒤로 = 채팅 목록
  모양: 알림 설정(admin/notification/home.html 설정 탭)과 같은 묶음 설정 목록 — 13px 회색 묶음 제목 · 흰 카드 · 56px 행 · 토글 · '값 ›' 행 · 13px 회색 안내
  state: (기본) · time(시작 시간 시트) · time-end(종료 시간 시트) · delay(지연 안내 메시지 시트) · off(챗봇 꺼짐 — 챗봇 하위 행 흐리게) · consult-off(상담 운영 꺼짐 — 시간 행 흐리게)
  ERD 컬럼: TBL_CHAT_SETTING.BOT_ENABLED · HOURS_ENABLED(= 상담 운영: 끄면 운영 시간이어도 상담원 연결 안 받음 · 휴무 등) · START_TIME/END_TIME(늘 적용)("09:00") · DELAY_MESSAGE(500, 선택 — 비우면 '설정 안 함')
            (GREETING 은 채팅 시작 화면, UPDATED_AT·ADMIN_ID 는 화면에 표시하지 않음)
  하위 화면: 채팅 시작 화면(chat-entry) · 챗봇 답변 관리(chat-answers) · 자주 쓰는 답변(chat-replies, TBL_SAVED_REPLY) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='채팅 설정', active='chat', fixed=true, content=~{::content}, scripts=~{::scripts})}">
<body>
<th:block th:fragment="content"><th:block th:with="state=${param.state != null ? param.state[0] : ''},
    botOn=${param.state == null or param.state[0] != 'off'},
    toggleCls='group relative h-[30px] w-[50px] shrink-0 rounded-full bg-[#e5e7eb] transition-colors aria-pressed:bg-[#346538] disabled:opacity-50',
    rowCls='flex h-14 w-full items-center justify-between gap-3 px-5 text-left transition-opacity',
    ic=@{/images/admin/icons-v2.svg}">
  <div class="relative flex h-full min-h-0 flex-col overflow-hidden" id="chatSettings" th:attr="data-state=${state}">
    <!--/* 1행: 뒤로(→ 채팅 목록) · 페이지 제목 */-->
    <div class="relative z-20 box-content flex h-9 shrink-0 items-center gap-1 bg-[#f7f8f6] px-4 pb-3 pt-5 transition-shadow" data-scroll-head>
      <a th:href="@{/admin/chats}" aria-label="채팅 목록으로 돌아가기"
         class="-ml-2 grid h-9 w-9 place-items-center rounded-full text-[#292929] hover:bg-[#eef0ee]">
        <svg class="icon" width="24" height="24"><use th:href="${ic} + '#i-chevronLeft'"/></svg>
      </a>
      <h2 class="px-1 text-[22px] font-extrabold tracking-[-0.03em] text-[#1a1a1a]">채팅 설정</h2>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-6 pt-2" data-scroll-body>
      <!--/* 챗봇 */-->
      <h3 class="px-1 text-[13px] font-semibold text-[#888]">챗봇</h3>
      <section class="mt-2 overflow-hidden rounded-[20px] bg-white shadow-[0_2px_12px_rgba(26,26,26,.05)]">
        <div class="flex h-14 items-center justify-between gap-3 border-b border-[#eef0ee] px-5">
          <span class="text-[16px] font-medium text-[#292929]">챗봇 사용</span>
          <button type="button" data-switch="bot" aria-label="챗봇 사용" th:attr="aria-pressed=${botOn}" th:class="${toggleCls}">
            <span class="absolute left-[3px] top-[3px] h-6 w-6 rounded-full bg-white shadow-[0_1px_3px_rgba(26,26,26,.2)] transition-transform group-aria-pressed:translate-x-5"></span>
          </button>
        </div>
        <a th:href="@{/admin/chats/entry}" data-needs="bot" th:class="${rowCls} + ' border-b border-[#eef0ee]'" th:classappend="${!botOn} ? 'opacity-40'">
          <span class="text-[16px] font-medium text-[#292929]">채팅 시작 화면</span>
          <svg class="icon text-[#b0b4b1]" width="18" height="18"><use th:href="${ic} + '#i-chevronRight'"/></svg>
        </a>
        <a th:href="@{/admin/chats/answers}" data-needs="bot" th:class="${rowCls}" th:classappend="${!botOn} ? 'opacity-40'">
          <span class="text-[16px] font-medium text-[#292929]">챗봇 답변 관리</span>
          <svg class="icon text-[#b0b4b1]" width="18" height="18"><use th:href="${ic} + '#i-chevronRight'"/></svg>
        </a>
      </section>
      <p data-bot-footer th:hidden="${botOn}" class="mt-2 break-keep px-1 text-[13px] text-[#888]">챗봇을 끄면 고객 문의가 바로 상담 대기로 넘어갑니다.</p>

      <!--/* 상담 */-->
      <h3 class="mt-7 px-1 text-[13px] font-semibold text-[#888]">상담</h3>
      <section class="mt-2 overflow-hidden rounded-[20px] bg-white shadow-[0_2px_12px_rgba(26,26,26,.05)]">
        <div class="flex h-14 items-center justify-between gap-3 border-b border-[#eef0ee] px-5">
          <span class="text-[16px] font-medium text-[#292929]">상담 운영</span>
          <button type="button" data-switch="consult" aria-label="상담 운영" th:attr="aria-pressed=${state != 'consult-off'}" th:class="${toggleCls}">
            <span class="absolute left-[3px] top-[3px] h-6 w-6 rounded-full bg-white shadow-[0_1px_3px_rgba(26,26,26,.2)] transition-transform group-aria-pressed:translate-x-5"></span>
          </button>
        </div>
        <!--/* 시작·종료 시간 — 각 행이 그 시각만 고르는 시트를 연다 (저장 값 24시간 "09:00", 표기 오전/오후) */-->
        <button type="button" th:each="e : ${ {'start|시작 시간|09:00|오전 09:00', 'end|종료 시간|18:00|오후 06:00'} }" th:with="t=${#strings.arraySplit(e, '|')}"
                th:attr="data-time-row=${t[0]}, data-value=${t[2]}" th:class="${rowCls} + ' border-b border-[#eef0ee] disabled:cursor-default'">
          <span class="text-[16px] font-medium text-[#292929]" data-time-label th:text="${t[1]}">시작 시간</span>
          <span class="flex items-center gap-0.5 text-[15px] font-medium tabular-nums text-[#666]">
            <span data-time-text th:text="${t[3]}">오전 09:00</span>
            <svg class="icon text-[#b0b4b1]" width="18" height="18"><use th:href="${ic} + '#i-chevronRight'"/></svg>
          </span>
        </button>
        <button type="button" id="delayRow" th:class="${rowCls} + ' border-b border-[#eef0ee]'">
          <span class="shrink-0 text-[16px] font-medium text-[#292929]">지연 안내 메시지</span>
          <span class="flex min-w-0 items-center gap-0.5 text-[15px] text-[#666]">
            <!--/* 문구는 시트에서만 보임 · 행에는 비워 둔 경우에만 '설정 안 함' */-->
            <span id="delayText" hidden class="text-[#b0b4b1]">설정 안 함</span>
            <svg class="icon shrink-0 text-[#b0b4b1]" width="18" height="18"><use th:href="${ic} + '#i-chevronRight'"/></svg>
          </span>
        </button>
        <a th:href="@{/admin/chats/replies}" th:class="${rowCls}">
          <span class="text-[16px] font-medium text-[#292929]">자주 쓰는 답변</span>
          <span class="flex items-center gap-0.5 text-[15px] font-medium tabular-nums text-[#666]">5개
            <svg class="icon text-[#b0b4b1]" width="18" height="18"><use th:href="${ic} + '#i-chevronRight'"/></svg>
          </span>
        </a>
      </section>
    </div>
  </div>

  <!--/* 시간 시트 — 누른 행(시작 시간 또는 종료 시간) 하나만: 제목 + 휠(오전/오후 · 시 · 분) + [완료] */-->
  <div id="timeSheet" data-layer hidden class="absolute inset-0 z-40 flex items-end bg-[#1a1a1a]/40">
    <div role="dialog" aria-modal="true" aria-labelledby="timeSheetTitle"
         class="w-full rounded-t-[24px] bg-white px-5 pb-[calc(20px+var(--safe-bottom))] pt-2 shadow-[0_-8px_30px_rgba(26,26,26,.12)] [animation:slideUp_.2s_ease-out]">
      <div class="mx-auto h-1 w-9 rounded-full bg-[#dcdfdc]"></div>
      <div class="mt-3 flex items-center justify-between">
        <h3 id="timeSheetTitle" class="text-[18px] font-bold text-[#1a1a1a]" data-time-title>시작 시간</h3>
        <button type="button" data-close aria-label="닫기" class="-mr-2 grid h-10 w-10 place-items-center rounded-full text-[#555] hover:bg-[#f0f1ef]">
          <svg class="icon" width="22" height="22"><use th:href="${ic} + '#i-x'"/></svg>
        </button>
      </div>
      <div class="relative mt-2 grid grid-cols-3 gap-2" style="height:132px">
        <div class="pointer-events-none absolute inset-x-0 top-[44px] h-11 rounded-[12px] bg-[#f2f5f2]"></div>
        <div th:each="col : ${ {'period|오전 오후', 'hour|시', 'minute|분'} }" th:with="c=${#strings.arraySplit(col, '|')}"
             th:attr="data-wheel=${c[0]}, aria-label=${c[1]}" role="listbox" tabindex="0"
             class="relative h-full snap-y snap-mandatory overflow-y-auto py-[44px] [scrollbar-width:none] [mask-image:linear-gradient(transparent,#000_30%,#000_70%,transparent)] [&::-webkit-scrollbar]:hidden">
          <th:block th:switch="${c[0]}">
            <th:block th:case="'period'"><div th:each="v : ${ {'오전','오후'} }" role="option" th:attr="data-value=${v}" th:text="${v}" class="grid h-11 snap-center place-items-center text-[18px] text-[#b0b4b1] aria-selected:font-bold aria-selected:text-[#1a1a1a]">오전</div></th:block>
            <th:block th:case="'hour'"><div th:each="h : ${#numbers.sequence(1, 12)}" role="option" th:attr="data-value=${#numbers.formatInteger(h, 2)}" th:text="${#numbers.formatInteger(h, 2)} + '시'" class="grid h-11 snap-center place-items-center text-[18px] tabular-nums text-[#b0b4b1] aria-selected:font-bold aria-selected:text-[#1a1a1a]">01시</div></th:block>
            <th:block th:case="*"><div th:each="m : ${ {'00','10','20','30','40','50'} }" role="option" th:attr="data-value=${m}" th:text="${m} + '분'" class="grid h-11 snap-center place-items-center text-[18px] tabular-nums text-[#b0b4b1] aria-selected:font-bold aria-selected:text-[#1a1a1a]">00분</div></th:block>
          </th:block>
        </div>
      </div>
      <button type="button" data-time-save class="btn-primary mt-4">완료</button>
    </div>
  </div>

  <!--/* 지연 안내 메시지 시트 (DELAY_MESSAGE 500자, 비워 두면 '설정 안 함') */-->
  <div id="delaySheet" data-layer hidden class="absolute inset-0 z-40 flex items-end bg-[#1a1a1a]/40">
    <div role="dialog" aria-modal="true" aria-labelledby="delayTitle"
         class="w-full rounded-t-[24px] bg-white px-5 pb-[calc(20px+var(--safe-bottom))] pt-2 shadow-[0_-8px_30px_rgba(26,26,26,.12)] [animation:slideUp_.2s_ease-out]">
      <div class="mx-auto h-1 w-9 rounded-full bg-[#dcdfdc]"></div>
      <div class="mt-3 flex items-center justify-between">
        <h3 id="delayTitle" class="text-[18px] font-bold text-[#1a1a1a]">지연 안내 메시지</h3>
        <button type="button" data-close aria-label="닫기" class="-mr-2 grid h-10 w-10 place-items-center rounded-full text-[#555] hover:bg-[#f0f1ef]">
          <svg class="icon" width="22" height="22"><use th:href="${ic} + '#i-x'"/></svg>
        </button>
      </div>
      <textarea data-delay-input maxlength="500" aria-label="지연 안내 메시지"
                class="mt-3 block h-40 w-full resize-none rounded-[14px] bg-white p-4 text-[15px] leading-6 text-[#1a1a1a] shadow-[inset_0_0_0_1px_#e5e7eb] outline-none focus:shadow-[inset_0_0_0_2px_#346538]"></textarea>
      <p class="mt-2 text-right text-[13px] tabular-nums text-[#888]" data-delay-count>0/500</p>
      <button type="button" data-delay-save class="btn-primary mt-2">저장</button>
    </div>
  </div>
</th:block></th:block>
<th:block th:fragment="scripts">
  <script>
    // 머리줄: 아래 내용이 스크롤되면 얇은 구분선 (머리는 z-20 · 바탕색으로 내용을 가림)
    document.querySelectorAll("[data-scroll-body]").forEach((sb) => { const head = sb.previousElementSibling; sb.addEventListener("scroll", () => head.classList.toggle("shadow-[0_1px_0_#e5e7eb]", sb.scrollTop > 0)); });
  </script>
  <script>
    (function () {
      const root = document.getElementById('chatSettings');
      const state = root.dataset.state;
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
      const sw = (n) => $(`[data-switch="${n}"]`, root);
      const on = (n) => sw(n).getAttribute('aria-pressed') === 'true';

      // 토글 · 흐리게 (챗봇 꺼짐 → 챗봇 하위 행 / 상담 운영 꺼짐(휴무 등 임시로 연결 안 받음) → 운영 시간 행)
      const timeRows = $$('[data-time-row]', root);
      function sync() {
        $$('[data-needs="bot"]', root).forEach((el) => el.classList.toggle('opacity-40', !on('bot')));
        $('[data-bot-footer]', root).hidden = on('bot');
        timeRows.forEach((r) => { r.disabled = !on('consult'); r.classList.toggle('opacity-40', !on('consult')); });
      }
      $$('[data-switch]', root).forEach((b) => b.addEventListener('click', () => { b.setAttribute('aria-pressed', String(!on(b.dataset.switch))); sync(); }));

      // 시간 시트 — 누른 행(시작 시간 / 종료 시간)만 바꾼다
      const sheet = document.getElementById('timeSheet');
      const ROW = 44;
      const opts = (w) => $$('[role=option]', w);
      const wheel = (n) => $(`[data-wheel="${n}"]`, sheet);
      const mark = (w) => { const i = Math.round(w.scrollTop / ROW); opts(w).forEach((o, k) => o.setAttribute('aria-selected', String(k === i))); };
      const val = (n) => opts(wheel(n))[Math.round(wheel(n).scrollTop / ROW)].dataset.value;
      function setWheel(n, v) { const w = wheel(n); w.scrollTop = Math.max(0, opts(w).findIndex((o) => o.dataset.value === v)) * ROW; mark(w); }
      // 화면 표기는 오전/오후 (저장 값은 24시간 "18:00")
      const ampm = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return `${h >= 12 ? '오후' : '오전'} ${String(h % 12 || 12).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };
      function readWheels() {
        const h12 = Number(val('hour'));
        const h24 = val('period') === '오후' ? (h12 % 12) + 12 : (h12 === 12 ? 0 : h12);
        return `${String(h24).padStart(2, '0')}:${val('minute')}`;
      }
      $$('[data-wheel]', sheet).forEach((w) => {
        w.addEventListener('scroll', () => mark(w));
        w.addEventListener('click', (e) => { const o = e.target.closest('[role=option]'); if (o) w.scrollTo({ top: opts(w).indexOf(o) * ROW, behavior: 'smooth' }); });
      });
      let target = timeRows[0];
      function openTime(row) {
        target = row;
        $('[data-time-title]', sheet).textContent = $('[data-time-label]', row).textContent;
        sheet.hidden = false;
        const [h, m] = row.dataset.value.split(':').map(Number);
        setWheel('period', h >= 12 ? '오후' : '오전');
        setWheel('hour', String(h % 12 || 12).padStart(2, '0'));
        setWheel('minute', String(m - (m % 10)).padStart(2, '0'));
      }
      timeRows.forEach((r) => r.addEventListener('click', () => { if (!r.disabled) openTime(r); }));
      $('[data-time-save]', sheet).addEventListener('click', () => {
        target.dataset.value = readWheels();
        $('[data-time-text]', target).textContent = ampm(target.dataset.value);
        sheet.hidden = true;
      });

      // 지연 안내 메시지 시트
      const delay = document.getElementById('delaySheet');
      const input = $('[data-delay-input]', delay);
      const text = document.getElementById('delayText');
      let message = '현재 상담원 연결이 지연되고 있습니다. 조금만 기다려주세요.';
      const count = () => { $('[data-delay-count]', delay).textContent = `${input.value.length}/500`; };
      function openDelay() { input.value = message; count(); delay.hidden = false; }
      document.getElementById('delayRow').addEventListener('click', openDelay);
      input.addEventListener('input', count);
      $('[data-delay-save]', delay).addEventListener('click', () => {
        message = input.value.trim();
        text.hidden = Boolean(message);
        delay.hidden = true;
      });

      sync();
      if (state === 'time') openTime(timeRows[0]);
      if (state === 'time-end') openTime(timeRows[1]);
      if (state === 'delay') openDelay();
    })();
  </script>
</th:block>
</body>
</html>
