<!DOCTYPE html>
<!--/* SCR-A-016 홈(대시보드) */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='홈', active='home', fixed=false, content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content">
  <div class="space-y-5 px-4 pb-28 pt-5">
    <!--/* 현황 카드 */-->
    <section class="grid grid-cols-2 gap-3">
      <a th:each="s : ${stats}" th:href="@{${s.link}}"
         class="rounded-[18px] border border-white bg-white p-4 text-left shadow-[0_5px_18px_rgba(36,58,39,.07)] transition hover:-translate-y-0.5 hover:shadow-[0_8px_22px_rgba(36,58,39,.11)]">
        <div class="mb-5 flex items-center justify-between">
          <span class="text-[12px] font-semibold text-[#6d746f]" th:text="${s.label}">전체 예약 신청</span>
          <span class="grid h-8 w-8 place-items-center rounded-xl bg-[#edf3ed] text-[#346538]">
            <svg class="icon" width="17" height="17"><use th:href="@{/images/admin/icons.svg} + '#i-' + ${s.icon}"/></svg>
          </span>
        </div>
        <p class="flex items-baseline gap-1">
          <strong class="text-[27px] font-extrabold tracking-[-0.04em] text-[#222a24]" th:text="${s.value}">30</strong>
          <span class="text-[12px] font-medium text-[#919792]">건</span>
        </p>
      </a>
    </section>

    <!--/* 주간 예약 현황 */-->
    <a th:href="@{/admin/reservations}" class="block rounded-[20px] bg-white p-5 shadow-[0_5px_18px_rgba(36,58,39,.06)]">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-[16px] font-bold text-[#222a24]">주간 예약 현황</h3>
          <p class="mt-1 text-[11px] text-[#959b96]">이번 주 접수된 예약은 총 <span th:text="${weeklyTotal}">10</span>건입니다</p>
        </div>
        <span class="rounded-lg bg-[#edf3ed] px-2.5 py-1.5 text-[10px] font-bold text-[#346538]">이번 주</span>
      </div>
      <div class="mt-5">
        <svg aria-label="주간 예약 건수 선 그래프" class="h-[130px] w-full" viewBox="0 0 340 130">
          <defs>
            <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#346538" stop-opacity=".18"/>
              <stop offset="100%" stop-color="#346538" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <line th:each="y : ${ {18, 53, 88} }" stroke="#edf0ed" stroke-dasharray="3 5" x1="8" x2="332" th:attr="y1=${y},y2=${y}"/>
          <path d="M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27"
                fill="none" stroke="#346538" stroke-linecap="round" stroke-width="3"/>
          <path d="M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27 L330 106 L10 106Z"
                fill="url(#chartFill)"/>
          <circle th:each="p : ${ {'10,91', '63,70', '116,48', '169,65', '222,37', '276,57', '330,27'} }"
                  th:attr="cx=${#strings.substringBefore(p, ',')},cy=${#strings.substringAfter(p, ',')}"
                  fill="white" r="4" stroke="#346538" stroke-width="2.5"/>
        </svg>
        <div class="-mt-3 grid grid-cols-7 text-center text-[10px] font-medium text-[#969c97]">
          <span th:each="d : ${ {'월','화','수','목','금','토','일'} }" th:text="${d}">월</span>
        </div>
      </div>
    </a>

    <!--/* 최근 예약 내역 */-->
    <section class="rounded-[20px] bg-white p-5 shadow-[0_5px_18px_rgba(36,58,39,.06)]">
      <div class="mb-1 flex items-center justify-between">
        <h3 class="text-[16px] font-bold text-[#222a24]">최근 예약 내역</h3>
        <a th:href="@{/admin/reservations}" class="text-[11px] font-bold text-[#346538]">전체보기</a>
      </div>
      <div>
        <article th:each="r : ${recentReservations}" class="border-b border-[#eef0ee] py-4 last:border-none last:pb-0">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 items-start gap-3">
              <div class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[#edf3ed] text-[12px] font-bold text-[#346538]"
                   th:text="${#strings.substring(r.name, 0, 1)}">홍</div>
              <div class="min-w-0">
                <p class="text-[13px] font-bold text-[#2e3530]">
                  <span th:text="${r.name}">홍길동</span>
                  <span class="ml-2 font-normal text-[#a0a5a1]" th:text="${r.movingDate}">26.09.27</span>
                </p>
                <p class="mt-1 truncate text-[11px] text-[#7d847f]" th:text="|${r.origin} → ${r.destination}|">출발 → 도착</p>
              </div>
            </div>
            <span class="shrink-0 rounded-full bg-[#f1f5f1] px-2.5 py-1 text-[10px] font-semibold text-[#346538]" th:text="${r.status}">예약 완료</span>
          </div>
        </article>
      </div>
    </section>
  </div>
</th:block>
</body>
</html>
