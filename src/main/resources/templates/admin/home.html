<!DOCTYPE html>
<!--/* SCR-A-016 홈(대시보드) — 디자인 기준: docs/ui/관리자디자인기준.md
  모델: today, stats(label·value·icon·tone·link), weeklyTotal, chart(line·area·points — 이번 주 월~일 접수 예약), recentReservations(name·movingDate·origin·destination·status)
  (DashboardService). 모델이 없으면(미리보기) 그래프는 예시 모양 */-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/admin-layout :: layout(title='홈', active='home', fixed=false, content=~{::content}, scripts=~{})}">
<body>
<th:block th:fragment="content">
  <div class="space-y-4 px-4 pb-28 pt-5">
    <div class="px-1">
      <h2 class="text-[22px] font-extrabold tracking-[-0.03em] text-[#1a1a1a]">오늘의 현황</h2>
      <p class="mt-1 text-[14px] text-[#888]" th:text="${today}">2026년 11월 2일 (월)</p>
    </div>

    <!--/* 현황 카드 — 색: 조치가 필요한 항목(견적 검토)만 주황, 나머지는 초록 계열 */-->
    <section class="grid grid-cols-2 gap-3">
      <a th:each="s : ${stats}" th:href="@{${s.link}}"
         class="rounded-[20px] bg-white p-4 shadow-[0_2px_12px_rgba(26,26,26,.05)] transition active:scale-[.98]">
        <span class="grid h-11 w-11 place-items-center rounded-[14px]" th:classappend="${s.tone}">
          <svg class="icon" width="24" height="24"><use th:href="@{/images/admin/icons-v2.svg} + '#i-' + ${s.icon}"/></svg>
        </span>
        <p class="mt-4 text-[15px] font-semibold text-[#555]" th:text="${s.label}">전체 예약 신청</p>
        <p class="mt-1 flex items-baseline gap-1">
          <strong class="text-[30px] font-extrabold leading-none tracking-[-0.03em] text-[#1a1a1a]" th:text="${s.value}">30</strong>
          <span class="text-[15px] font-medium text-[#888]">건</span>
        </p>
      </a>
    </section>

    <!--/* 주간 예약 현황 */-->
    <a th:href="@{/admin/reservations}" class="block rounded-[20px] bg-white p-5 shadow-[0_2px_12px_rgba(26,26,26,.05)]">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-[17px] font-bold text-[#1a1a1a]">주간 예약 현황</h3>
          <p class="mt-1 text-[14px] text-[#888]">이번 주 접수된 예약 <b class="font-bold text-[#346538]" th:text="${weeklyTotal} + '건'">10건</b></p>
        </div>
        <span class="rounded-full bg-[#eef4f0] px-3 py-1 text-[13px] font-bold text-[#346538]">이번 주</span>
      </div>
      <svg aria-label="주간 예약 건수 선 그래프" class="mt-4 h-[140px] w-full" viewBox="0 0 340 130">
        <defs>
          <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#346538" stop-opacity=".16"/>
            <stop offset="100%" stop-color="#346538" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line th:each="y : ${ {18, 53, 88} }" stroke="#eceeec" stroke-dasharray="3 5" x1="8" x2="332" th:attr="y1=${y},y2=${y}"/>
        <path d="M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27 L330 106 L10 106Z" th:attr="d=${chart?.area} ?: 'M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27 L330 106 L10 106Z'" fill="url(#chartFill)"/>
        <path d="M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27" th:attr="d=${chart?.line} ?: 'M10 91 C32 86 40 68 63 70 S91 39 116 48 S145 72 169 65 S198 32 222 37 S249 68 276 57 S307 21 330 27'" fill="none" stroke="#346538" stroke-linecap="round" stroke-width="3"/>
        <circle th:each="p : ${chart?.points ?: {'10,91', '63,70', '116,48', '169,65', '222,37', '276,57', '330,27'}}"
                th:attr="cx=${#strings.substringBefore(p, ',')},cy=${#strings.substringAfter(p, ',')}" fill="white" r="4.5" stroke="#346538" stroke-width="2.5"/>
      </svg>
      <div class="-mt-2 grid grid-cols-7 text-center text-[13px] font-medium text-[#888]">
        <span th:each="d : ${ {'월','화','수','목','금','토','일'} }" th:text="${d}">월</span>
      </div>
    </a>

    <!--/* 최근 예약 내역 — 상태는 목록 칩 규칙(완료 = 초록, 취소 = 붉은 주황) */-->
    <section class="rounded-[20px] bg-white p-5 shadow-[0_2px_12px_rgba(26,26,26,.05)]">
      <div class="flex items-center justify-between">
        <h3 class="text-[17px] font-bold text-[#1a1a1a]">최근 예약 내역</h3>
        <a th:href="@{/admin/reservations}" class="flex items-center gap-0.5 text-[14px] font-semibold text-[#346538]">
          전체보기 <svg class="icon" width="16" height="16"><use th:href="@{/images/admin/icons-v2.svg} + '#i-chevronRight'"/></svg>
        </a>
      </div>
      <ul class="mt-2">
        <li th:each="r : ${recentReservations}" class="flex items-center gap-3 border-b border-[#eef0ee] py-4 last:border-none last:pb-1">
          <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-[#eef4f0] text-[16px] font-bold text-[#346538]"
                th:text="${#strings.substring(r.name, 0, 1)}">홍</span>
          <div class="min-w-0 flex-1">
            <p class="flex items-baseline gap-2">
              <strong class="text-[16px] font-bold text-[#1a1a1a]" th:text="${r.name}">홍길동</strong>
              <span class="text-[13px] text-[#888]" th:text="${r.movingDate}">26.09.27</span>
            </p>
            <p class="mt-1 truncate text-[14px] text-[#555]" th:text="|${r.origin} → ${r.destination}|">출발 → 도착</p>
          </div>
          <span class="chip shrink-0" th:classappend="${r.status == '예약 취소'} ? 'chip-cancel' : 'chip-done'" th:text="${r.status}">예약 완료</span>
        </li>
      </ul>
    </section>
  </div>
</th:block>
</body>
</html>
