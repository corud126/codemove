spring:
  application:
    name: codemove
  profiles:
    # DB 계정은 application-local.yml(git 제외)에 작성
    active: local
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # 영상 견적 업로드
      max-file-size: 500MB
      max-request-size: 500MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codemove.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

server:
  port: 8080
  servlet:
    session:
      # URL 에 ;jsessionid= 가 붙지 않도록 쿠키로만 세션 유지
      tracking-modes: cookie

---
# 로컬 개발: 템플릿·정적 파일을 src에서 직접 읽어 수정 즉시 반영 (재시작 불필요)
spring:
  config:
    activate:
      on-profile: local
  thymeleaf:
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
