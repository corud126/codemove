spring:
  application:
    name: codemove
  profiles:
    # DB 계정은 application-local.yml(git 제외)에 작성
    active: local
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # 영상 견적 업로드
      max-file-size: 500MB
      max-request-size: 500MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codemove.domain
  configuration:
    map-underscore-to-camel-case: true
    # 따옴표 필수: YAML 은 NULL 을 빈 값으로 읽어 설정이 빠진다
    jdbc-type-for-null: "NULL"

server:
  port: 8080
  servlet:
    session:
      # URL 에 ;jsessionid= 가 붙지 않도록 쿠키로만 세션 유지
      tracking-modes: cookie

# 간편 로그인 앱 키는 application-local.yml 에 작성 (비어 있으면 해당 로그인 버튼은 로그인 방법 선택으로 돌아감)
codemove:
  oauth:
    providers:
      kakao:
        client-id:
        client-secret:
      naver:
        client-id:
        client-secret:
  # 카카오 로컬 API(주소 검색 · 좌표) REST API 키 (application-local.yml 에 작성, 비어 있으면 카카오 로그인 client-id, 그것도 없으면 예시 주소로 검색)
  kakao:
    rest-api-key:
  # 공공데이터포털 특일 정보 키 (application-local.yml 에 작성, 비어 있으면 내장 공휴일 목록 2026~2027)
  holiday:
    service-key:
  # 채팅: 응답 지연 안내(분) · 대화 없으면 자동 종료(분) · 첨부 저장 폴더 · 첨부 최대 크기(MB)
  chat:
    delay-minutes: 10
    idle-end-minutes: 30
    upload-dir: uploads/chat
    max-file-mb: 10
  # 알림: 기본 조회 기간(일) · 관리자 내역 한 번에 불러올 개수 · 사용자 목록·관리자 패널 최대 개수 · 이사 임박 알림(D-n)
  #        이사 임박 알림 시각(cron) · 방해 금지 시간에 보류한 알림 발송 주기(cron)
  notification:
    recent-days: 30
    page-size: 20
    user-list-size: 100
    panel-size: 100
    reminder-days: 3
    reminder-cron: "0 0 9 * * *"
    flush-cron: "0 */10 * * * *"
  # 후기 사진 저장 폴더 · 사진 1장 최대 크기(MB)
  review:
    upload-dir: uploads/reviews
    max-photo-mb: 10
  # 견적 요청: 톤 환산은 ERD 임시 규칙, 단가(pricing)는 업체 기준이 정해질 때까지 임시값
  quote:
    upload-dir: uploads
    cbm-per-ton: 6
    ton-step: 0.5
    min-ton: 1
    deposit-rate: 0.1
    review-confidence: 70
    pricing:
      base-fee: 150000
      per-ton: 100000
      partial-pack-rate: 1.2
      range-min-rate: 0.95
      range-max-rate: 1.15
      round-unit: 10000
  # 영상 분석 테스트 (관리자 /admin/video-analysis, 견적 흐름 · DB 에는 아직 연결하지 않음. 기준은 팀 CodeMove-AI 와 같게)
  #  standard-csv · alias-csv · truck-csv: 품목 기준표 · 별칭 · 트럭 적재 CSV 경로 · testset-dir: 정답 목록 폴더
  #  load-factor: 물품 부피 × 적재계수 = 적재 부피 (대표님 통화 기준 2.0)
  #  run-dir: 테스트 영상 · 실행 기록 폴더 · 영상 한도 200MB · 5초~5분 (14MB 넘으면 Gemini Files API 로 올림)
  #  gemini: 주 모델 · 혼잡(503)/한도(429)일 때 예비 모델 · 생각 수준(low)
  #  gemini.api-key · price(100만 토큰당 단가)는 application-local.yml 에 작성 (비어 있으면 JSON 직접 입력만 · 비용 '단가 미설정')
  video-analysis:
    standard-csv:
    alias-csv:
    truck-csv:
    testset-dir:
    load-factor: 2.0
    run-dir: uploads/video-analysis
    max-video-mb: 200
    min-duration-sec: 5
    max-duration-sec: 300
    allowed-extensions: [mp4, mov, webm]
    gemini:
      api-key:
      model: gemini-4-hydrogen
      fallback-models: [gemini-3.5-flash]
      thinking-level: low
      timeout-sec: 300
      max-retries: 2
    # 100만 토큰당 단가: 팀(CodeMove-AI)과 같은 값 (gemini-4-hydrogen · 3.5-flash 공통, 출시 블로그 기준) — Google 공식 가격 페이지와 대조 필요
    price:
      input-per-million: 1.50
      output-per-million: 7.50
      currency: USD
      as-of: 2026-11-23

---
# 로컬 개발: 템플릿·정적 파일을 src에서 직접 읽어 수정 즉시 반영 (재시작 불필요)
spring:
  config:
    activate:
      on-profile: local
  thymeleaf:
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
